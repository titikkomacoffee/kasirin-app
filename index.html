<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KasirPro POS - Supabase Connected</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

  <!-- TOPBAR / NAVIGASI -->
  <header class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div id="brandIcon" class="bg-indigo-600 p-2 rounded-lg transition-colors">
        <i class="fa-solid fa-cash-register text-white text-xl"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-none">KasirPro POS</h1>
        <span class="text-xs text-gray-400">Database Status: <span id="dbStatus" class="text-amber-400 font-medium">Menghubungkan...</span></span>
      </div>
    </div>

    <!-- Pilihan Tema Warna UI -->
    <div class="flex items-center gap-3">
      <span class="text-xs text-gray-400">Tema Warna:</span>
      <select id="themeSelect" onchange="changeTheme(this.value)" class="bg-gray-700 border border-gray-600 text-xs text-white rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="indigo">Indigo Modern (Default)</option>
        <option value="emerald">Emerald Fresh</option>
        <option value="rose">Rose Glam</option>
        <option value="amber">Amber Warm</option>
      </select>
    </div>
  </header>

  <!-- KONTEN UTAMA POS -->
  <main class="flex-1 flex overflow-hidden">

    <!-- BAGIAN KIRI: KATALOG PRODUK & PENCARIAN (60% Width) -->
    <section class="w-7/12 p-4 flex flex-col gap-4 border-r border-gray-800">
      
      <!-- Filter Kategori & Search Bar -->
      <div class="flex flex-col gap-3">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400"></i>
          <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Cari nama produk atau SKU..." class="w-full bg-gray-800 border border-gray-700 rounded-xl pl-10 pr-4 py-2 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-indigo-500 transition">
        </div>

        <!-- Filter Kategori Button -->
        <div class="flex gap-2 overflow-x-auto pb-1" id="categoryContainer">
          <button onclick="setCategory('Semua')" class="cat-btn bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition">Semua</button>
          <button onclick="setCategory('Makanan')" class="cat-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-4 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition">Makanan</button>
          <button onclick="setCategory('Minuman')" class="cat-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-4 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition">Minuman</button>
          <button onclick="setCategory('Bahan Baku')" class="cat-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-4 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition">Bahan Baku</button>
        </div>
      </div>

      <!-- Grid Katalog Produk -->
      <div id="productGrid" class="flex-1 overflow-y-auto grid grid-cols-3 gap-3 pr-1">
        <div class="col-span-3 text-center text-gray-500 py-10 text-sm">Memuat produk dari Supabase...</div>
      </div>
    </section>

    <!-- BAGIAN KANAN: KERANJANG BELANJA & PEMBAYARAN (40% Width) -->
    <section class="w-5/12 bg-gray-800/50 p-4 flex flex-col justify-between">
      <div>
        <!-- Header Keranjang -->
        <div class="flex justify-between items-center mb-3 pb-2 border-b border-gray-700">
          <h2 class="font-bold text-md flex items-center gap-2">
            <i class="fa-solid fa-cart-shopping text-indigo-400"></i> Keranjang Transaksi
          </h2>
          <button onclick="clearCart()" class="text-xs text-rose-400 hover:text-rose-300 transition">
            <i class="fa-solid fa-trash-can"></i> Kosongkan
          </button>
        </div>

        <!-- Daftar Item di Keranjang -->
        <div id="cartItems" class="max-h-[320px] overflow-y-auto space-y-2 pr-1">
          <div class="text-center py-12 text-gray-500 text-xs">
            <i class="fa-solid fa-basket-shopping text-3xl mb-2 text-gray-600"></i><br>
            Keranjang belanja masih kosong
          </div>
        </div>
      </div>

      <!-- RINGKASAN PEMBAYARAN & KALKULASI -->
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-3 mt-4">
        <div class="space-y-1.5 text-xs">
          <div class="flex justify-between text-gray-400">
            <span>Subtotal:</span>
            <span id="subtotalText" class="font-semibold text-white">Rp 0</span>
          </div>
          
          <!-- Input Diskon -->
          <div class="flex justify-between items-center">
            <span class="text-gray-400">Diskon:</span>
            <div class="flex items-center gap-1 w-36">
              <input type="number" id="discountInput" oninput="calculateTotal()" placeholder="0" value="0" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1 text-right text-xs text-white focus:outline-none focus:border-indigo-500">
              <select id="discountType" onchange="calculateTotal()" class="bg-gray-900 border border-gray-700 rounded px-1 py-1 text-xs text-white focus:outline-none">
                <option value="nominal">Rp</option>
                <option value="percent">%</option>
              </select>
            </div>
          </div>

          <div class="flex justify-between text-base font-bold text-white pt-2 border-t border-gray-700">
            <span>Total Akhir:</span>
            <span id="totalText" class="text-indigo-400">Rp 0</span>
          </div>
        </div>

        <!-- Input Bayar & Kembalian -->
        <div class="space-y-2 pt-2 border-t border-gray-700">
          <div>
            <label class="text-[11px] text-gray-400 block mb-1">Nominal Uang Diterima (Tunai):</label>
            <input type="number" id="cashInput" oninput="calculateTotal()" placeholder="0" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm font-semibold text-emerald-400 focus:outline-none focus:border-emerald-500">
          </div>

          <div class="flex justify-between items-center text-xs bg-gray-900 p-2 rounded-lg border border-gray-700">
            <span class="text-gray-400">Kembalian:</span>
            <span id="changeText" class="font-bold text-emerald-400">Rp 0</span>
          </div>
        </div>

        <!-- Tombol Aksi Transaksi -->
        <div class="grid grid-cols-2 gap-2 pt-2">
          <button onclick="holdTransaction()" class="bg-amber-600 hover:bg-amber-500 text-white font-medium py-2 rounded-lg text-xs transition flex items-center justify-center gap-1">
            <i class="fa-solid fa-pause"></i> Simpan (Hold)
          </button>
          <button id="btnPay" onclick="processPayment()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-lg text-xs transition flex items-center justify-center gap-1">
            <i class="fa-solid fa-print"></i> Bayar & Struk
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // ----------------------------------------------------
    // 1. SUPABASE CONFIGURATION (MASUKKAN URL & KEY ANDA)
    // ----------------------------------------------------
    const SUPABASE_URL = 'https://ankprmkhsqkgugzndlcx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFua3BybWtoc3FrZ3Vnem5kbGN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI2NzgsImV4cCI6MjEwNTg0ODY3OH0.D48Jxrv2f51Ggl9yT5Tayme5eDAC_Eo1jpM_pmGfp-E';
    
    // Inisialisasi Supabase SDK
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let products = [];
    let cart = [];
    let currentCategory = 'Semua';

    // ----------------------------------------------------
    // 2. MEMUAT DATA PRODUK DARI SUPABASE DATABASE
    // ----------------------------------------------------
    async function loadProductsFromSupabase() {
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*');

        if (error) throw error;

        products = data || [];
        document.getElementById('dbStatus').innerText = 'Terhubung';
        document.getElementById('dbStatus').className = 'text-emerald-400 font-medium';
        renderProducts(products);
      } catch (err) {
        console.error('Gagal mengambil data:', err.message);
        document.getElementById('dbStatus').innerText = 'Gagal Konek / Cek API Key';
        document.getElementById('dbStatus').className = 'text-rose-400 font-medium';
        document.getElementById('productGrid').innerHTML = `<div class="col-span-3 text-center text-rose-400 py-10 text-xs">Gagal mengambil produk dari Supabase.<br>Pastikan SUPABASE_URL dan SUPABASE_ANON_KEY sudah diisi dengan benar.</div>`;
      }
    }

    // ----------------------------------------------------
    // 3. RENDER KATALOG PRODUK KE TAMPILAN
    // ----------------------------------------------------
    function renderProducts(itemsToRender = products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      if (itemsToRender.length === 0) {
        grid.innerHTML = `<div class="col-span-3 text-center text-gray-500 py-10 text-sm">Tidak ada produk ditemukan</div>`;
        return;
      }

      itemsToRender.forEach(p => {
        grid.innerHTML += `
          <div onclick="addToCart('${p.id}')" class="bg-gray-800 border border-gray-700 hover:border-indigo-500 rounded-xl p-3 cursor-pointer transition flex flex-col justify-between hover:scale-[1.02]">
            <div>
              <span class="text-[10px] bg-gray-700 text-indigo-300 px-1.5 py-0.5 rounded font-mono">${p.sku || 'NO-SKU'}</span>
              <h3 class="font-semibold text-xs mt-1 text-gray-200 line-clamp-1">${p.name}</h3>
            </div>
            <div class="mt-2 flex justify-between items-end">
              <span class="text-xs font-bold text-indigo-400">Rp ${Number(p.price).toLocaleString('id-ID')}</span>
              <span class="text-[10px] text-gray-400">Stok: ${p.stock}</span>
            </div>
          </div>
        `;
      });
    }

    // ----------------------------------------------------
    // 4. PENCARIAN & FILTER KATEGORI
    // ----------------------------------------------------
    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => {
        const matchesCategory = (currentCategory === 'Semua') || (p.category === currentCategory);
        const matchesQuery = p.name.toLowerCase().includes(query) || (p.sku && p.sku.toLowerCase().includes(query));
        return matchesCategory && matchesQuery;
      });
      renderProducts(filtered);
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if(btn.innerText === cat) {
          btn.className = "cat-btn bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition";
        } else {
          btn.className = "cat-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-4 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition";
        }
      });
      filterProducts();
    }

    // ----------------------------------------------------
    // 5. KERANJANG BELANJA
    // ----------------------------------------------------
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const cartItem = cart.find(item => item.id === productId);

      if (cartItem) {
        if (cartItem.qty < product.stock) {
          cartItem.qty++;
        } else {
          alert('Stok produk telah mencapai batas maksimal!');
        }
      } else {
        cart.push({ ...product, qty: 1 });
      }
      renderCart();
    }

    function updateQty(productId, delta) {
      const cartItem = cart.find(item => item.id === productId);
      const product = products.find(p => p.id === productId);

      if (cartItem) {
        cartItem.qty += delta;
        if (cartItem.qty > product.stock) {
          cartItem.qty = product.stock;
          alert('Stok maksimal dicapai!');
        }
        if (cartItem.qty <= 0) {
          cart = cart.filter(item => item.id !== productId);
        }
      }
      renderCart();
    }

    function clearCart() {
      cart = [];
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-gray-500 text-xs">
            <i class="fa-solid fa-basket-shopping text-3xl mb-2 text-gray-600"></i><br>
            Keranjang belanja masih kosong
          </div>`;
        calculateTotal();
        return;
      }

      cart.forEach(item => {
        container.innerHTML += `
          <div class="bg-gray-900 border border-gray-700/80 rounded-lg p-2.5 flex justify-between items-center text-xs">
            <div class="flex-1 pr-2">
              <h4 class="font-medium text-gray-200">${item.name}</h4>
              <span class="text-[11px] text-indigo-400">Rp ${Number(item.price).toLocaleString('id-ID')}</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="updateQty('${item.id}', -1)" class="w-6 h-6 bg-gray-800 hover:bg-gray-700 text-white rounded flex items-center justify-center font-bold">-</button>
              <span class="w-6 text-center font-semibold text-white">${item.qty}</span>
              <button onclick="updateQty('${item.id}', 1)" class="w-6 h-6 bg-gray-800 hover:bg-gray-700 text-white rounded flex items-center justify-center font-bold">+</button>
            </div>
          </div>
        `;
      });

      calculateTotal();
    }

    // ----------------------------------------------------
    // 6. KALKULASI DISKON & UANG KEMBALIAN
    // ----------------------------------------------------
    function calculateTotal() {
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const discountVal = parseFloat(document.getElementById('discountInput').value) || 0;
      const discountType = document.getElementById('discountType').value;
      
      let totalDiscount = 0;
      if (discountType === 'percent') {
        totalDiscount = (subtotal * discountVal) / 100;
      } else {
        totalDiscount = discountVal;
      }

      const grandTotal = Math.max(0, subtotal - totalDiscount);
      const cash = parseFloat(document.getElementById('cashInput').value) || 0;
      const change = cash - grandTotal;

      document.getElementById('subtotalText').innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
      document.getElementById('totalText').innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
      
      const changeText = document.getElementById('changeText');
      if (change >= 0) {
        changeText.innerText = `Rp ${change.toLocaleString('id-ID')}`;
        changeText.className = "font-bold text-emerald-400";
      } else {
        changeText.innerText = `- Rp ${Math.abs(change).toLocaleString('id-ID')}`;
        changeText.className = "font-bold text-rose-400";
      }
    }

    // ----------------------------------------------------
    // 7. MENYIMPAN TRANSAKSI KE DATABASE SUPABASE
    // ----------------------------------------------------
    async function processPayment() {
      if (cart.length === 0) return alert('Keranjang masih kosong!');
      
      const cash = parseFloat(document.getElementById('cashInput').value) || 0;
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const discountVal = parseFloat(document.getElementById('discountInput').value) || 0;
      const discountType = document.getElementById('discountType').value;
      const totalDiscount = discountType === 'percent' ? (subtotal * discountVal / 100) : discountVal;
      const grandTotal = Math.max(0, subtotal - totalDiscount);

      if (cash < grandTotal) {
        return alert('Nominal uang bayar kurang dari total belanja!');
      }

      const btnPay = document.getElementById('btnPay');
      btnPay.disabled = true;
      btnPay.innerText = "Memproses...";

      try {
        const trxCode = 'TRX-' + Date.now();

        // 1. Simpan Header Transaksi ke Supabase[span_2](start_span)[span_2](end_span)
        const { data: trxData, error: trxError } = await supabaseClient
          .from('transactions')
          .insert([{
            trx_code: trxCode,
            total_amount: grandTotal,
            discount: totalDiscount,
            payment_method: 'CASH',
            cash_amount: cash,
            change_amount: cash - grandTotal,
            status: 'PAID'
          }])
          .select();

        if (trxError) throw trxError;

        const transactionId = trxData[0].id;

        // 2. Simpan Item Detail Transaksi[span_3](start_span)[span_3](end_span)
        const itemsToInsert = cart.map(item => ({
          transaction_id: transactionId,
          product_id: item.id,
          quantity: item.qty,
          price: item.price,
          subtotal: item.price * item.qty
        }));

        const { error: itemError } = await supabaseClient
          .from('transaction_items')
          .insert(itemsToInsert);

        if (itemError) throw itemError;

        alert(`Transaksi ${trxCode} Berhasil Disimpan Ke Database!`);
        clearCart();
        document.getElementById('cashInput').value = '';
        document.getElementById('discountInput').value = '0';
        
        // Refresh katalog produk (jika stok terupdate)
        loadProductsFromSupabase();

      } catch (err) {
        console.error('Error simpan transaksi:', err.message);
        alert('Gagal menyimpan transaksi: ' + err.message);
      } finally {
        btnPay.disabled = false;
        btnPay.innerHTML = `<i class="fa-solid fa-print"></i> Bayar & Struk`;
      }
    }

    function holdTransaction() {
      if (cart.length === 0) return alert('Keranjang kosong, tidak bisa hold bill!');
      alert('Transaksi berhasil disimpan sementara (Hold Bill).');
      clearCart();
    }

    // ----------------------------------------------------
    // 8. TEMA WARNA
    // ----------------------------------------------------
    function changeTheme(theme) {
      const brandIcon = document.getElementById('brandIcon');
      if (theme === 'emerald') {
        brandIcon.className = "bg-emerald-600 p-2 rounded-lg transition-colors";
      } else if (theme === 'rose') {
        brandIcon.className = "bg-rose-600 p-2 rounded-lg transition-colors";
      } else if (theme === 'amber') {
        brandIcon.className = "bg-amber-600 p-2 rounded-lg transition-colors";
      } else {
        brandIcon.className = "bg-indigo-600 p-2 rounded-lg transition-colors";
      }
    }

    // Jalankan pertama kali saat halaman dibuka
    loadProductsFromSupabase();
  </script>
</body>
</html>
