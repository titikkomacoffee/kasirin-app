function posGrid(){$('#grid').innerHTML=prods.filter(p=>(cat=='Semua'||p.category==cat)&&(p.name+(p.sku||'')).toLowerCase().includes(q.toLowerCase())).map(p=>`<button class=pr onclick="add('${p.id}')" ${p.stock!=null&&p.stock<1?'disabled style="opacity:.4"':''}>${p.photo?`<img src="${p.photo}" alt="">`:`<div class=ph>${esc((p.name||"?")[0]).toUpperCase()}</div>`}<b>${esc(p.name)}</b><span>${p.price?rp(p.price):'Harga bebas'}</span><br><small>${p.stock==null?'':'stok '+p.stock}</small></button>`).join('')||'<p class=m>Belum ada produk. Tambahkan di menu Produk.</p>'}
async function add(id){const p=prods.find(x=>x.id==id),i=cart.find(x=>x.id==id);if(p.stock!=null&&(i?i.qty:0)>=p.stock)return toast('Stok tidak cukup');let pr=+p.price;if(!i&&!pr){const r=await dlg({t:'Harga '+p.name,m:'Harga jual belum diisi. Masukkan harga untuk transaksi ini.',ic:'dollar',f:[{l:'Harga (Rp)',type:'number',ph:'0'}],ok:'Tambah'});pr=+(r&&r[0]);if(!pr)return}const j=cart.find(x=>x.id==id);j?j.qty++:cart.push({id,name:p.name,price:pr,cost:+p.cost||0,qty:1});cartDraw()}
function chg(id,d){const i=cart.find(x=>x.id==id),p=prods.find(x=>x.id==id);if(d>0&&p.stock!=null&&i.qty>=p.stock)return toast('Stok tidak cukup');i.qty+=d;if(i.qty<1)cart=cart.filter(x=>x!=i);cartDraw()}
const sub=()=>cart.reduce((a,i)=>a+i.price*i.qty,0);
function cartDraw(){const h=JSON.parse(localStorage.hold||'[]');$('#cartbox').innerHTML=`<h3>Keranjang</h3>${cart.map(i=>`<div class=row style="margin:6px 0"><div style="flex:1"><b>${esc(i.name)}</b><br><small>${rp(i.price)}</small></div><button class=ic onclick="chg('${i.id}',-1)">➖</button><b>${i.qty}</b><button class=ic onclick="chg('${i.id}',1)">➕</button></div>`).join('')||'<p class=m>Kosong. Ketuk produk untuk menambah.</p>'}<div class=row><small>Diskon (Rp)</small><input type=number value="${disc||''}" oninput="disc=+this.value;$('#tt').textContent=rp(sub()-disc)"></div><div class=row><h3 style="flex:1">Total</h3><h3 id=tt>${rp(sub()-disc)}</h3></div><div class=row><button class="btn ghost" onclick=hold()>Tahan</button><button class="btn ghost" onclick=showHold()>Tersimpan (${h.length})</button></div><button class=btn onclick=payM()>Bayar</button>`}
async function hold(){if(!cart.length)return;const r=await dlg({t:'Tahan transaksi',m:'Beri nama atau nomor meja agar mudah dicari lagi.',ic:'receipt',f:[{l:'Nama / meja',ph:'Contoh: Meja 3'}],ok:'Tahan'});if(!r)return;const h=JSON.parse(localStorage.hold||'[]');h.push({n:r[0]||'Tanpa nama',cart,disc});localStorage.hold=JSON.stringify(h);cart=[];disc=0;cartDraw();toast('Transaksi ditahan')}
function showHold(){const h=JSON.parse(localStorage.hold||'[]');modal('<h3>Transaksi ditahan</h3>'+(h.map((x,i)=>`<div class="card row"><b style="flex:1">${esc(x.n)}</b><button class=btn onclick="resume(${i})">Lanjut</button></div>`).join('')||'<p class=m>Tidak ada.</p>'))}
function resume(i){const h=JSON.parse(localStorage.hold);({cart,disc}=h[i]);h.splice(i,1);localStorage.hold=JSON.stringify(h);closeM();cartDraw()}
function payM(){if(!shift)return toast('Buka shift dulu di menu Shift');if(!cart.length)return;modal(`<h3>Bayar ${rp(sub()-disc)}</h3><select id=pm onchange=pmChg()><option value=tunai>Tunai</option><option value=qris>QRIS</option><option value=piutang>Piutang (bayar nanti)</option></select><div id=pmx></div><button class=btn onclick=pay()>Selesaikan</button>`);pmChg()}
function pmChg(){const m=$('#pm').value,tot=sub()-disc;$('#pmx').innerHTML=m=='tunai'?`<input id=pd type=number placeholder="Uang diterima" oninput="$('#kb').textContent=rp(Math.max(0,this.value-${tot}))"><p>Kembalian: <b id=kb>Rp0</b></p><input id=cu placeholder="Nama pelanggan (opsional)">`:m=='qris'?`${cfg.qris?`<img src="${cfg.qris}" style="width:100%;max-width:260px;display:block;margin:auto">`:'<p class=m>QRIS belum diupload admin (menu Setelan).</p>'}<input id=cu placeholder="Nama pelanggan (opsional)"><small>Bukti pembayaran (opsional)</small><input id=pf type=file accept=image/*>`:`<input id=cu placeholder="Nama pelanggan"><small>Jatuh tempo</small><input id=dd type=date><input id=dp type=number placeholder="DP (opsional)">`}
async function pay(){const m=$('#pm').value,tot=sub()-disc;let paid=tot,change=0,proof=null,cu=null,dp=0,due=null;
 if(m=='tunai'){paid=+$('#pd').value;if(paid<tot)return toast('Uang kurang');change=paid-tot}
 if(m=='qris'){const f=$('#pf').files[0];if(f)proof=await up(f,'bukti')}
 cu=($('#cu')?.value||'').trim()||null;if(m=='piutang'){if(!cu)return toast('Isi nama pelanggan');dp=+$('#dp').value||0;paid=dp;due=$('#dd').value||null}
 const trx='TRX'+ymd(new Date()).slice(2).replace(/-/g,'')+Math.random().toString(36).slice(2,6).toUpperCase();
 const{data:t,error}=await sb.from('transactions').insert({trx,cashier_id:me.id,cashier:me.name,branch_id:me.branch_id,subtotal:sub(),discount:disc,total:tot,method:m,paid,change,proof,customer:cu}).select().single();
 if(error)return toast(error.message);
 await sb.from('transaction_items').insert(cart.map(i=>({trx_id:t.id,product_id:i.id,name:i.name,price:i.price,cost:i.cost,qty:i.qty})));
 const rr=await sb.rpc('sell_deduct',{p_items:cart.map(i=>({product_id:i.id,qty:i.qty}))});if(rr.error)toast('Stok gagal diperbarui: '+rr.error.message);await loadProds();
 if(m=='piutang')await sb.from('receivables').insert({trx_id:t.id,customer:cu,total:tot,paid:dp,due_date:due});
 const items=cart;cart=[];disc=0;posDraw();receipt(t,items)}
function receipt(t,items){const txt=`${cfg.store||'KasirKu'}\n${t.trx}\n`+items.map(i=>`${i.name} ${i.qty}x${rp(i.price)}`).join('\n')+`\nTotal ${rp(t.total)} (${t.method})`;
 modal(`<h3>Struk</h3><div class=rc><b>${esc(cfg.store||'KasirKu')}</b><br>${t.trx}<br>${new Date(t.created_at).toLocaleString('id-ID')}<br>Kasir: ${esc(t.cashier)}<hr>${items.map(i=>`${esc(i.name)}<br>${i.qty} x ${rp(i.price)}<span>${rp(i.qty*i.price)}</span><br>`).join('')}<hr>Diskon<span>${rp(t.discount)}</span><br><b>Total<span>${rp(t.total)}</span></b><br>${t.method.toUpperCase()}<span>${rp(t.paid)}</span><br>Kembali<span>${rp(t.change)}</span><br><center>Terima kasih</center></div><button class=btn onclick=window.print()>🖨️ Cetak (thermal)</button><a class="btn ghost" target=_blank href="https://wa.me/?text=${encodeURIComponent(txt)}">Kirim via WhatsApp</a><button class="btn ghost" onclick=closeM()>Tutup</button>`)}

function wrap(x,t,px,py,mw,lh,max){const ls=[];let l='';t.split(' ').forEach(w=>{const tt=l?l+' '+w:w;if(x.measureText(tt).width>mw&&l){ls.push(l);l=w}else l=tt});ls.push(l);ls.slice(0,max).forEach((q,i)=>x.fillText(q+(i==max-1&&ls.length>max?'…':''),px,py+i*lh))}
async function drawMap(x,bx,by,sz,lat,lng){const z=18,n=2**z,tx=(lng+180)/360*n,r=lat*Math.PI/180,ty=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n,fx=Math.floor(tx),fy=Math.floor(ty),ts=256,ox=bx+sz/2-(tx-fx)*ts,oy=by+sz/2-(ty-fy)*ts;
 x.save();x.beginPath();x.roundRect(bx,by,sz,sz,14);x.clip();x.fillStyle='#5b6b7a';x.fillRect(bx,by,sz,sz);const jobs=[];
 for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)jobs.push(loadImg(`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${fy+dy}/${fx+dx}`).then(im=>im&&x.drawImage(im,ox+dx*ts,oy+dy*ts,ts,ts)));
 await Promise.all(jobs);x.restore();x.lineWidth=5;x.strokeStyle='#fff';x.beginPath();x.roundRect(bx,by,sz,sz,14);x.stroke();
 const cx=bx+sz/2,cy=by+sz/2;x.fillStyle='#1d9bf0';x.beginPath();x.arc(cx,cy-16,13,0,7);x.fill();x.beginPath();x.moveTo(cx-9,cy-8);x.lineTo(cx+9,cy-8);x.lineTo(cx,cy+4);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(cx,cy-16,5,0,7);x.fill()}
V.absen=async()=>{if(stream)stream.getTracks().forEach(t=>t.stop());main().innerHTML=`<h2>Absensi</h2><video id=vd autoplay playsinline muted style="width:100%;border-radius:20px;background:#000;aspect-ratio:3/4;object-fit:cover"></video><div class=row><button class=btn onclick="snap('masuk')">Absen masuk</button><button class="btn ghost" onclick="snap('keluar')">Absen pulang</button></div><button class="btn ghost" onclick="fm=fm=='user'?'environment':'user';V.absen()">🔄 Balik kamera</button><small>Foto diambil langsung dari kamera. Jam, alamat, peta & kode foto tercetak otomatis di foto.</small><div id=al></div>`;
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:fm,width:{ideal:1080},height:{ideal:1440}}});$('#vd').srcObject=stream}catch(e){toast('Izinkan akses kamera')}
 let r=sb.from('attendance').select('*').order('created_at',{ascending:false}).limit(30);if(me.role=='kasir')r=r.eq('user_id',me.id);const{data}=await r;$('#al').innerHTML=(data||[]).map(a=>`<div class="card row"><a href="${a.photo}" target=_blank><img class=th src="${a.photo}" alt=""></a><div style="flex:1"><b>${esc(a.name)} · ${a.type=='masuk'?'masuk':'pulang'}</b><br><small>${new Date(a.created_at).toLocaleString('id-ID')}</small></div><a href="https://maps.google.com/?q=${a.lat},${a.lng}" target=_blank>📍</a></div>`).join('')}
async function snap(type){const v=$('#vd');if(!v||!v.videoWidth)return toast('Kamera belum siap');toast('Memproses foto…');
 const pos=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:12000})).catch(()=>null);if(!pos)return toast('Izinkan akses lokasi');
 const lat=pos.coords.latitude,lng=pos.coords.longitude,W=720,H=960,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const sc=Math.max(W/v.videoWidth,H/v.videoHeight),dw=v.videoWidth*sc,dh=v.videoHeight*sc;x.drawImage(v,(W-dw)/2,(H-dh)/2,dw,dh);
 const g=x.createLinearGradient(0,H*.5,0,H);g.addColorStop(0,'#0000');g.addColorStop(1,'#000c');x.fillStyle=g;x.fillRect(0,H*.5,W,H*.5);
 const now=new Date(),code=Array.from({length:14},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789'[Math.floor(Math.random()*34)]).join('');
 const[addr,logo]=await Promise.all([fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=id&lat=${lat}&lon=${lng}`).then(r=>r.json()).then(j=>j.display_name).catch(()=>null),cfg.logo?loadImg(cfg.logo):null]);
 x.fillStyle='#fff';if(logo){const lh=110;x.drawImage(logo,24,505,Math.min(logo.width*lh/logo.height,200),lh)}
 x.font='800 78px '+FN;const tm=now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':');x.fillText(tm,24,692);x.fillStyle='#f5a623';x.fillRect(x.measureText(tm).width+40,632,5,60);
 x.fillStyle='#fff';x.font='600 20px '+FN;x.fillText(now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),24,722);
 x.font='500 21px '+FN;wrap(x,addr||lat.toFixed(6)+', '+lng.toFixed(6),24,752,470,26,2);
 x.fillStyle='#0008';x.beginPath();x.roundRect(16,800,470,92,12);x.fill();x.fillStyle='#fff';x.font='600 23px '+FN;x.fillText('Absensi '+(type=='masuk'?'Masuk':'Pulang')+': '+(cfg.store||'KasirKu'),30,832);x.fillText('Nama: '+me.name,30,870);
 x.font='500 17px '+FN;x.fillStyle='#ffffffcc';x.fillText('Kode Foto: '+code,24,922);
 await drawMap(x,W-224,H-224,200,lat,lng);
 const url=await up(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)),'absen');if(!url)return;
 const{error}=await sb.from('attendance').insert({user_id:me.id,name:me.name,type,photo:url,lat,lng});toast(error?error.message:'Absen '+(type=='masuk'?'masuk':'pulang')+' tersimpan ✔');V.absen()}

// ---------- Gaji ----------
let gU=null;
V.gaji=async()=>{gU=gU||me.id;const adm=LV[me.role]>=1,{data:us}=await sb.from('profiles').select('*').eq('active',true),u=(us||[]).find(x=>x.id==gU)||me,n=new Date(),a=iso(new Date(n.getFullYear(),n.getMonth(),1));
 const[{data:t},{data:at},{data:kb}]=await Promise.all([sb.from('transactions').select('id,created_at').eq('cashier_id',u.id).gte('created_at',a),sb.from('attendance').select('type,created_at').eq('user_id',u.id).gte('created_at',a),sb.from('cashbons').select('*').eq('user_id',u.id).gte('created_at',a).order('created_at',{ascending:false})]);
 const ids=(t||[]).map(x=>x.id),it=ids.length?(await sb.from('transaction_items').select('trx_id,qty').in('trx_id',ids)).data:[],day={},E=d=>day[d]=day[d]||{i:0,o:0,q:0},dm={};
 (at||[]).forEach(r=>E(ymd(r.created_at))[r.type=='masuk'?'i':'o']++);(t||[]).forEach(r=>dm[r.id]=ymd(r.created_at));(it||[]).forEach(r=>E(dm[r.trx_id]).q+=r.qty);
 const ma=+u.meal_allowance||0,b=+u.bonus_per_item||0,base=+u.base_salary||0,today=ymd(n);
 const rows=Object.entries(day).sort().reverse().map(([d,v])=>{const meal=v.i&&v.o?ma:0;return{d,meal,q:v.q,ins:v.q*b,tot:meal+v.q*b,note:v.i&&!v.o?(d==today?'menunggu absen pulang':'tidak absen pulang'):(!v.i&&v.q?'tanpa absen masuk':'')}});
 const mT=sum(rows,r=>r.meal),iT=sum(rows,r=>r.ins),qT=sum(rows,r=>r.q),hd=rows.filter(r=>r.meal>0).length,kT=sum(kb,r=>r.amount),gj=base+mT+iT,tr=rows.find(r=>r.d==today);
 main().innerHTML=`<h2>Gaji</h2>${adm?`<select onchange="gU=this.value;V.gaji()">${(us||[]).map(x=>`<option value="${x.id}" ${x.id==u.id?'selected':''}>${esc(x.name)} (${x.role})</option>`).join('')}</select>`:''}<small>Periode ${n.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</small>
 <div class=card><b>Hari ini · ${esc(u.name)}</b><div class=row style="margin-top:8px"><span style="flex:1">Uang makan</span><small>${tr&&tr.meal?rp(tr.meal):(tr?.note||'-')}</small></div><div class=row><span style="flex:1">${tr?tr.q:0} produk × ${rp(b)}</span><span>${rp(tr?tr.ins:0)}</span></div><div class=row><b style="flex:1">Total hari ini</b><b>${rp(tr?tr.tot:0)}</b></div></div>
 <div class=kpi><div class=card><small>Gaji periode ini (berjalan)</small><b>${rp(gj)}</b><small>${hd} hari hadir · ${qT} produk</small></div><div class=card><small>Sisa diterima</small><b>${rp(gj-kT)}</b><small>${kT?'Kas bon '+rp(kT):'Belum ada kas bon'}</small></div><div class=card><small>Uang makan</small><b>${rp(mT)}</b><small>${hd} hari × ${rp(ma)}</small></div><div class=card><small>Insentif produk</small><b>${rp(iT)}</b><small>${qT} produk × ${rp(b)}</small></div></div>
 ${base?`<div class="card row"><span style="flex:1">Gaji pokok</span><b>${rp(base)}</b></div>`:''}
 <div class=card><div class=row><b style="flex:1">Kas bon</b>${LV[me.role]>=2?'<button class=btn style="width:auto" onclick=kasbon()>+ Kas bon</button>':''}</div>${(kb||[]).map(r=>`<div class=row style="margin-top:6px"><small style="flex:1">${new Date(r.created_at).toLocaleDateString('id-ID')} · ${esc(r.note||'')}</small><b>${rp(r.amount)}</b></div>`).join('')||'<p class=m>Tidak ada kas bon di periode ini.</p>'}</div>
 <div class=card><b>Rincian per hari</b>${rows.map(r=>`<div style="display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:4px;padding:8px 0;border-top:1px dashed var(--b);font-size:13px"><span><b>${new Date(r.d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</b><br><small>${r.note}</small></span><span>${r.meal?rp(r.meal):'-'}</span><span>${rp(r.ins)}<br><small>${r.q} produk</small></span><b>${rp(r.tot)}</b></div>`).join('')||'<p class=m>Belum ada data.</p>'}<small>Kolom: tanggal · uang makan · insentif · total. Uang makan dihitung setelah absen masuk dan pulang.</small></div>`}
async function kasbon(){const r=await dlg({t:'Catat kas bon',ic:'wallet',f:[{l:'Jumlah (Rp)',type:'number',ph:'0'},{l:'Keterangan',ph:'Opsional'}],ok:'Simpan'});if(!r||!+r[0])return;const x=await sb.from('cashbons').insert({user_id:gU,amount:+r[0],note:r[1]});toast(x.error?x.error.message:'Kas bon dicatat');V.gaji()}

// ---------- Kirim Bahan ----------
let ing=[],qv={},MY='Pusat';
V.kirim=async()=>{const[{data:i},{data:b},{data:h}]=await Promise.all([sb.from('ingredients').select('*').order('name'),sb.from('branches').select('*'),sb.from('transfers').select('*,transfer_items(*)').order('created_at',{ascending:false}).limit(15)]);ing=i||[];brs=b||[];qv={};MY=brs.find(x=>x.id==me.branch_id)?.name||'Pusat';
 main().innerHTML=`<div class=row><h2 style="flex:1">Kirim bahan</h2>${LV[me.role]>=1?'<button class=btn style="width:auto" onclick=ingForm()>+ Bahan</button>':''}</div><div class=card>Dari: <b>${esc(MY)}</b> <small>· isi dalam satuan pakai</small><select id=kd>${['Pusat',...brs.map(x=>x.name)].filter(n=>n!=MY).map(n=>`<option>${esc(n)}</option>`).join('')}</select></div><input placeholder="Cari bahan" oninput="ingList(this.value)"><div class=card id=il></div><button class=btn onclick=sendIng()>Simpan kiriman</button><h3>Riwayat kiriman</h3>`+(h||[]).map(t=>`<div class=card><b>${esc(t.from_name)} → ${esc(t.to_name)}</b><br><small>${new Date(t.created_at).toLocaleString('id-ID')} · ${esc(t.by_name||'')}</small><br>${(t.transfer_items||[]).map(i=>`${esc(i.name)}: ${i.qty} ${esc(i.unit)}`).join('<br>')}</div>`).join('');ingList('')}
function ingList(k){$('#il').innerHTML=ing.filter(b=>b.name.toLowerCase().includes(k.toLowerCase())).map(b=>`<div class=row style="padding:8px 0;border-bottom:1px dashed var(--b)"><div style="flex:1"><b>${esc(b.name)}</b><br><small>Satuan ${esc(b.unit)}</small></div><input type=number inputmode=decimal style="width:110px;text-align:right" placeholder=0 value="${qv[b.id]||''}" oninput="qv['${b.id}']=+this.value"></div>`).join('')||'<p class=m>Belum ada bahan. Manager/Admin dapat menambah lewat tombol + Bahan.</p>'}
async function sendIng(){const items=ing.filter(b=>qv[b.id]>0);if(!items.length)return toast('Isi jumlah bahan yang dikirim');const to=$('#kd').value;if(!to)return toast('Pilih tujuan');const{data:t,error}=await sb.from('transfers').insert({from_name:MY,to_name:to,created_by:me.id,by_name:me.name}).select().single();if(error)return toast(error.message);await sb.from('transfer_items').insert(items.map(b=>({transfer_id:t.id,name:b.name,unit:b.unit,qty:qv[b.id]})));toast('Kiriman tersimpan ✔');V.kirim()}
function ingForm(id){const b=ing.find(x=>x.id==id)||{};modal(`<h3>${id?'Ubah':'Tambah'} bahan</h3><input id=bn placeholder="Nama bahan (mis. Bubuk Matcha)" value="${esc(b.name)}"><select id=bu>${['gram','ml','pcs'].map(u=>`<option ${u==b.unit?'selected':''}>${u}</option>`).join('')}</select><input id=bs type=number inputmode=decimal placeholder="Stok saat ini" value="${b.stock??''}"><button class=btn onclick="ingSave('${id||''}')">Simpan</button>`)}
V.bahan=async()=>{ing=(await sb.from('ingredients').select('*').order('name')).data||[];main().innerHTML=`<div class=row><h2 style="flex:1">Bahan baku</h2><button class=btn style="width:auto" onclick=ingForm()>+ Bahan</button></div><p class=m>${ing.length} jenis bahan · stok berkurang otomatis saat produk terjual (sesuai resep di menu Produk)</p>`+ing.map(b=>`<div class="card row"><div style="flex:1"><b>${esc(b.name)}</b><br><small>Stok ${+b.stock||0} ${esc(b.unit)}</small></div><button class=ic onclick="ingForm('${b.id}')">✏️</button><button class=ic onclick="ingDel('${b.id}')">🗑️</button></div>`).join('')}
async function ingDel(id){if(!await dlg({t:'Hapus bahan?',m:'Bahan akan dihapus dari semua resep produk.',ic:'box',ok:'Hapus',danger:true}))return;await sb.from('ingredients').delete().eq('id',id);V.bahan()}
async function ingSave(id){const n=$('#bn').value.trim();if(!n)return toast('Nama wajib');const o={name:n,unit:$('#bu').value,stock:+$('#bs').value||0},r=id?await sb.from('ingredients').update(o).eq('id',id):await sb.from('ingredients').insert(o);if(r.error)return toast(r.error.message);closeM();V[tab]()}

// ---------- Setelan ----------
V.setelan=()=>{main().innerHTML=`<h2>Setelan</h2><div class=card><b>Nama toko</b><input id=sn value="${esc(cfg.store)}" placeholder="Nama toko"><button class=btn onclick="setCfg('store',$('#sn').value)">Simpan</button></div><div class=card><b>Warna tema</b><div class=chips>${Object.entries(THEMES).map(([n,c])=>`<button class=chip style="border-color:${c};color:${c}" onclick="theme('${c}')">${n}</button>`).join('')}</div><button class="btn ghost" onclick="localStorage.dk=localStorage.dk=='on'?'off':'on';theme()">Mode gelap / terang</button></div><div class=card><b>QRIS statis</b><br>${cfg.qris?`<img src="${cfg.qris}" style="width:160px">`:''}<input id=qf type=file accept=image/*><button class=btn onclick=upQ()>Upload QRIS</button></div><div class=card><b>Logo toko (watermark absensi)</b><br>${cfg.logo?`<img src="${cfg.logo}" style="height:70px">`:''}<input id=lf type=file accept=image/*><button class=btn onclick=upL()>Upload logo</button></div><button class="btn ghost" onclick="sb.auth.signOut().then(()=>location.reload())">Keluar</button>`}
async function setCfg(k,v){cfg[k]=v;const r=await sb.from('settings').upsert({key:k,value:v});toast(r.error?r.error.message:'Tersimpan')}
async function upL(){const f=$('#lf').files[0];if(!f)return toast('Pilih gambar logo');const u=await up(f,'logo');if(u){await setCfg('logo',u);V.setelan()}}
async function upQ(){const f=$('#qf').files[0];if(!f)return toast('Pilih gambar QRIS');const u=await up(f,'qris');if(u){await setCfg('qris',u);V.setelan()}}
init();
</script></body></html>
