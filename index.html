<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEMAN COFFEE POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800 min-h-screen pb-24">

  <!-- HEADER BAR UTAMA -->
  <header class="bg-purple-700 text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <img id="storeLogoHeader" src="" alt="Logo Toko" class="w-9 h-9 rounded-full border-2 border-white object-cover hidden">
      <div>
        <h1 id="storeNameHeader" class="font-bold text-base leading-tight">TEMAN COFFEE POS</h1>
        <p id="userStatusHeader" class="text-[11px] text-purple-200">Memuat profil...</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="handleUserLogout()" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5">
        <i class="fa-solid fa-right-from-bracket"></i> Keluar
      </button>
    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- TAB 1: DASHBOARD -->
    <section id="tabDashboard" class="tab-content space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-1">
          <span class="text-[10px] text-gray-400 font-bold uppercase">Total Pesanan</span>
          <p id="dashTotalOrdersText" class="text-xl font-black text-gray-800">0</p>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-1">
          <span class="text-[10px] text-gray-400 font-bold uppercase">Penjualan Hari Ini</span>
          <p id="dashTotalSalesText" class="text-xl font-black text-emerald-600">Rp 0</p>
        </div>
      </div>
    </section>

    <!-- TAB 2: KASIR -->
    <section id="tabKasir" class="tab-content hidden space-y-4">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-xs"></i>
        <input type="text" id="searchProductInput" placeholder="Cari menu produk..." class="w-full bg-white border border-gray-200 rounded-2xl pl-9 pr-3 py-2 text-xs focus:outline-none focus:border-purple-600">
      </div>
      <div id="productGrid" class="grid grid-cols-2 gap-3"></div>
    </section>

    <!-- TAB 3: PENGATURAN TOKO (ADMIN ONLY) -->
    <section id="tabPengaturan" class="tab-content hidden space-y-4">
      <div id="sectionStoreMgmt" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3 hidden">
        <h3 class="font-bold text-xs text-gray-800 uppercase flex items-center gap-2 border-b pb-2">
          <i class="fa-solid fa-store text-purple-600"></i> Pengaturan Toko & Struk Cetak
        </h3>
        <div>
          <label class="text-[11px] font-bold text-gray-500">Nama Toko</label>
          <input type="text" id="storeNameInput" placeholder="TEMAN COFFEE KUPANG" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs">
        </div>
        <div>
          <label class="text-[11px] font-bold text-gray-500">Alamat Toko</label>
          <input type="text" id="storeAddressInput" placeholder="Jl. M. Praja No. 12, Kupang" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs">
        </div>
        <div>
          <label class="text-[11px] font-bold text-gray-500">Nomor Telepon Toko</label>
          <input type="text" id="storePhoneInput" placeholder="081234567890" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs">
        </div>
        <div>
          <label class="text-[11px] font-bold text-gray-500">URL Logo Toko</label>
          <input type="text" id="storeLogoUrlInput" placeholder="https://..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs">
        </div>
        <button onclick="saveStoreSettingsToSupabase()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md">
          Simpan Data Toko ke Supabase
        </button>
      </div>
    </section>
  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 py-2 px-4 flex justify-between items-center z-50 max-w-md mx-auto">
    <button onclick="switchTab('Dashboard')" id="navDashboard" class="nav-item text-purple-600 flex flex-col items-center gap-1">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[10px] font-bold">Beranda</span>
    </button>
    <button onclick="switchTab('Kasir')" id="navKasir" class="nav-item text-gray-400 flex flex-col items-center gap-1">
      <i class="fa-solid fa-cash-register text-base"></i>
      <span class="text-[10px] font-bold">Kasir</span>
    </button>
    <button onclick="openPaymentModal()" class="relative bg-purple-600 text-white p-3 rounded-full shadow-lg hover:bg-purple-700 transition -mt-5 border-4 border-gray-100">
      <i class="fa-solid fa-cart-shopping text-lg"></i>
      <span id="cartCountBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
    </button>
    <button onclick="switchTab('Pengaturan')" id="navPengaturan" class="nav-item text-gray-400 flex flex-col items-center gap-1">
      <i class="fa-solid fa-gear text-base"></i>
      <span class="text-[10px] font-bold">Pengaturan</span>
    </button>
  </nav>

  <!-- MODAL PEMBAYARAN -->
  <div id="paymentModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[80] hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl overflow-y-auto max-h-[90vh]">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-gray-800 text-sm">Pembayaran Transaksi</h3>
        <button onclick="closePaymentModal()" class="text-gray-400 text-xl font-bold">&times;</button>
      </div>

      <div class="bg-purple-50 p-4 rounded-2xl text-center space-y-1">
        <p class="text-[11px] text-gray-500 font-medium">Total Pembayaran</p>
        <p id="payModalTotalText" class="text-2xl font-black text-purple-700">Rp 0</p>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button id="btnPayCash" onclick="selectPaymentMethod('CASH')" class="p-3 border-2 border-purple-600 rounded-2xl bg-purple-50 text-purple-700 font-bold text-xs flex flex-col items-center gap-1">
          <i class="fa-solid fa-money-bill-wave text-lg"></i> Tunai (Cash)
        </button>
        <button id="btnPayQris" onclick="selectPaymentMethod('PAKASIR_QRIS')" class="p-3 border-2 border-gray-200 rounded-2xl bg-gray-50 text-gray-600 font-bold text-xs flex flex-col items-center gap-1">
          <i class="fa-solid fa-qrcode text-lg"></i> PAKASIR QRIS
        </button>
      </div>

      <!-- AREA GAMBAR DYNAMIC QRIS PAKASIR -->
      <div id="qrisDisplayArea" class="hidden text-center p-3 bg-gray-50 rounded-2xl border border-purple-200 space-y-2">
        <p class="text-[11px] font-bold text-purple-700">Scan QRIS PAKASIR di bawah ini:</p>
        <div class="bg-white p-2 rounded-xl inline-block shadow-sm">
          <img id="qrisImage" src="" alt="Pakasir QRIS Dynamic" class="w-48 h-48 mx-auto object-contain">
        </div>
        <p class="text-[10px] text-gray-400">QRIS dibuat otomatis oleh Supabase Server</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
  </html>
