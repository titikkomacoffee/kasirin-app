<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kasirin — Kasir & Manajemen Bisnis</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#241610">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kasirin">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --ink:#2B1B12;
  --ink-soft:#6B5541;
  --bg:#EDE4D6;
  --paper:#FBF8F2;
  --line:#DCD0BC;
  --line-strong:#C3B091;
  --pine:#241610;
  --pine-soft:#3A2419;
  --cream:#F3E9D8;
  --gold:#BC7A32;
  --gold-soft:#EDD6B0;
  --green:#5B7A52;
  --green-soft:#E2E8DA;
  --rust:#A1432B;
  --rust-soft:#F1D9CE;
  --radius:6px;
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:210px;flex-shrink:0;background:var(--pine);color:var(--cream);
  display:flex;flex-direction:column;padding:18px 0;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:0 20px 18px 20px;border-bottom:1px solid rgba(243,241,228,0.12);margin-bottom:10px;}
.brand-mark{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:0.2px;color:var(--cream);}
.brand-sub{font-size:11px;color:#9FB0A2;margin-top:2px;}
.nav{display:flex;flex-direction:column;gap:1px;padding:8px 10px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border:none;background:transparent;
  color:#C9D3C9;border-radius:var(--radius);font-size:13.5px;text-align:left;transition:background .12s;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.nav-item:hover{background:rgba(243,241,228,0.08);color:var(--cream);}
.nav-item.active{background:var(--pine-soft);color:var(--cream);box-shadow:inset 2px 0 0 var(--gold);}
.sidebar-foot{margin-top:auto;padding:14px 20px 4px 20px;border-top:1px solid rgba(243,241,228,0.12);font-size:11px;color:#8FA093;}

/* ---------- TOPBAR ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--paper);border-bottom:1px solid var(--line);
  padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:sticky;top:0;z-index:20;
}
.topbar-left{display:flex;align-items:center;gap:14px;}
.view-title{font-family:var(--font-display);font-size:20px;font-weight:600;}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;
  border:1px solid var(--line-strong);background:var(--cream);
}
.chip-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);}
.chip.on .chip-dot{background:var(--green);}
.chip.off .chip-dot{background:var(--rust);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.select-branch{
  padding:7px 10px;border-radius:var(--radius);border:1px solid var(--line-strong);background:var(--paper);font-size:13px;color:var(--ink);
}

.content{flex:1;padding:22px;overflow-x:hidden;}

/* ---------- BUTTONS ---------- */
.btn{
  border-radius:var(--radius);border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);
  padding:8px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:transform .08s, background .12s;
}
.btn:hover{background:var(--cream);}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--pine);color:var(--cream);border-color:var(--pine);}
.btn-primary:hover{background:var(--pine-soft);}
.btn-gold{background:var(--gold);color:#2b1c02;border-color:var(--gold);}
.btn-gold:hover{filter:brightness(1.05);}
.btn-danger{background:var(--rust-soft);color:var(--rust);border-color:#DBB5A9;}
.btn-danger:hover{background:#EDC9BC;}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--cream);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-block{width:100%;justify-content:center;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- CARDS / GRID ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px;}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.stat-label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.stat-value{font-family:var(--font-mono);font-size:22px;font-weight:600;}
.stat-sub{font-size:11px;color:var(--ink-soft);margin-top:4px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-weight:600;font-size:11.5px;color:var(--ink-soft);
  padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:hover td{background:rgba(0,0,0,0.015);}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);}
.mono{font-family:var(--font-mono);}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.tag-green{background:var(--green-soft);color:var(--green);}
.tag-gold{background:var(--gold-soft);color:#7A5713;}
.tag-rust{background:var(--rust-soft);color:var(--rust);}
.tag-grey{background:var(--cream);color:var(--ink-soft);}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-family:var(--font-display);font-size:19px;margin:0;font-weight:600;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.tab-btn{padding:9px 14px;border:none;background:transparent;font-size:13px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--gold);}

input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--paper);font-size:13px;color:var(--ink);width:100%;
}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ---------- POS VIEW ---------- */
.pos-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start;}
.pos-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.search-box{position:relative;flex:1;min-width:180px;}
.search-box input{padding-left:32px;}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-soft);}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.cat-tab{padding:6px 13px;border-radius:20px;border:1px solid var(--line-strong);background:var(--paper);font-size:12.5px;font-weight:500;color:var(--ink-soft);}
.cat-tab.active{background:var(--pine);color:var(--cream);border-color:var(--pine);}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.product-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:left;
  display:flex;flex-direction:column;gap:6px;transition:border-color .1s, transform .08s;
}
.product-card:hover{border-color:var(--gold);}
.product-card:active{transform:scale(0.97);}
.product-card:disabled{opacity:.4;cursor:not-allowed;}
.product-emoji{font-size:30px;line-height:1;}
.product-name{font-size:12.5px;font-weight:600;line-height:1.25;min-height:32px;}
.product-price{font-family:var(--font-mono);font-size:12.5px;color:var(--green);font-weight:600;}
.product-stock{font-size:10.5px;color:var(--ink-soft);}
.product-stock.low{color:var(--rust);font-weight:600;}

.receipt{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);position:sticky;top:70px;
  display:flex;flex-direction:column;max-height:calc(100vh - 100px);
}
.receipt-head{padding:14px 16px 10px 16px;border-bottom:1px dashed var(--line-strong);}
.receipt-head-title{font-family:var(--font-display);font-weight:600;font-size:15px;}
.receipt-items{flex:1;overflow-y:auto;padding:8px 16px;min-height:80px;}
.receipt-empty{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:30px 10px;}
.cart-line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.cart-line-name{font-size:12.5px;font-weight:600;flex:1;min-width:0;}
.cart-line-name div.p{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);font-weight:400;margin-top:2px;}
.qty-ctrl{display:flex;align-items:center;gap:6px;}
.qty-ctrl button{width:20px;height:20px;border-radius:4px;border:1px solid var(--line-strong);background:var(--cream);font-size:13px;line-height:1;padding:0;}
.qty-ctrl span{font-family:var(--font-mono);font-size:12.5px;min-width:16px;text-align:center;}
.cart-line-total{font-family:var(--font-mono);font-size:12.5px;font-weight:600;min-width:64px;text-align:right;}
.remove-x{background:none;border:none;color:var(--rust);font-size:14px;padding:0 2px;}
.receipt-foot{padding:12px 16px 16px 16px;border-top:1px dashed var(--line-strong);}
.row-between{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.row-between.total{font-size:16px;font-weight:700;font-family:var(--font-mono);margin-top:8px;padding-top:10px;border-top:1px solid var(--line);}
.receipt-actions{display:flex;gap:8px;margin-top:12px;}

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,25,20,0.45);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal-box{
  background:var(--paper);border-radius:8px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;
  border:1px solid var(--line);
}
.modal-box.wide{max-width:640px;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-family:var(--font-display);margin:0;font-size:17px;font-weight:600;}
.modal-close{background:none;border:none;font-size:18px;color:var(--ink-soft);line-height:1;padding:4px;}
.modal-body{padding:18px 20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state svg{width:38px;height:38px;margin-bottom:10px;opacity:.5;}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--pine);color:var(--cream);
  padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,0.2);
}
.qr-box{
  width:180px;height:180px;margin:0 auto;border:1px solid var(--line-strong);border-radius:6px;
  display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);padding:10px;background:#fff;
}
.qr-box div{background:transparent;}
.qr-box div.on{background:var(--ink);}

/* ---------- LOGIN SCREEN ---------- */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:
    radial-gradient(circle at 15% 15%, rgba(188,122,50,0.18), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(188,122,50,0.12), transparent 45%),
    var(--pine);
}
.login-card{
  background:var(--paper);border-radius:10px;width:100%;max-width:400px;padding:30px 28px;
  border:1px solid rgba(0,0,0,0.05);
}
.login-brand{text-align:center;margin-bottom:22px;}
.login-mark{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--ink);letter-spacing:0.3px;}
.login-sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
.emp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.emp-btn{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);transition:border-color .12s, transform .08s;
}
.emp-btn:hover{border-color:var(--gold);}
.emp-btn:active{transform:scale(0.97);}
.emp-avatar{
  width:42px;height:42px;border-radius:50%;background:var(--pine);color:var(--cream);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:15px;
}
.emp-btn-name{font-size:12.5px;font-weight:600;text-align:center;line-height:1.25;}
.emp-btn-role{font-size:10.5px;color:var(--ink-soft);}
.pin-back-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.pin-back-row button{background:none;border:none;font-size:18px;color:var(--ink-soft);padding:2px;}
.pin-emp-avatar{width:36px;height:36px;border-radius:50%;background:var(--pine);color:var(--cream);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:13px;}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0 22px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong);background:transparent;transition:background .1s, border-color .1s;}
.pin-dot.filled{background:var(--gold);border-color:var(--gold);}
.pin-dot.shake{animation:shakePin .4s;}
@keyframes shakePin{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;}
.pin-key{
  aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--paper);
  font-family:var(--font-mono);font-size:17px;font-weight:600;color:var(--ink);
}
.pin-key:hover{background:var(--bg);}
.pin-key:active{transform:scale(0.94);}
.pin-key.ghost{border:none;background:none;color:var(--ink-soft);font-size:13px;font-family:var(--font-body);}
.login-hint{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:16px;}

/* ---------- LOGO & TAGLINE ---------- */
.brand-logo-row{display:flex;align-items:center;gap:8px;}
.brand-logo-row svg{flex-shrink:0;color:var(--gold);}
.receipt-tagline{font-size:10.5px;color:var(--ink-soft);font-style:italic;margin-top:2px;}

/* ---------- RESPONSIVE / MULTI-DEVICE ---------- */
.hamburger-btn{display:none;background:none;border:none;padding:4px;color:var(--ink);align-items:center;}
.hamburger-btn svg{width:20px;height:20px;}
.sidebar-overlay{display:none;}
.receipt-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.receipt-mobile-close{display:none;background:none;border:none;font-size:20px;line-height:1;color:var(--ink-soft);padding:2px 4px;flex-shrink:0;}
.mobile-cart-bar{display:none;}

/* Tablet: sidebar collapses to icons-only */
@media (max-width: 1024px){
  .sidebar{width:64px;}
  .brand{padding:0 0 14px 0;text-align:center;}
  .brand-sub{display:none;}
  .brand-logo-row{justify-content:center;}
  .nav-item{justify-content:center;padding:10px;}
  .nav-item span{display:none;}
  .sidebar-foot{padding:14px 8px 4px 8px;text-align:center;font-size:0;}
  .sidebar-foot button span{display:none;}
  .pos-layout{grid-template-columns:1fr 300px;}
}

/* Mobile phones: off-canvas sidebar, stacked POS, floating cart */
@media (max-width: 768px){
  .sidebar{
    position:fixed;left:0;top:0;height:100vh;width:230px;z-index:70;
    transform:translateX(-100%);transition:transform .2s ease;box-shadow:4px 0 24px rgba(0,0,0,0.25);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar .brand{text-align:left;padding:0 20px 18px 20px;}
  .sidebar .brand-sub{display:block;}
  .sidebar .brand-logo-row{justify-content:flex-start;}
  .sidebar .nav-item{justify-content:flex-start;padding:9px 12px;}
  .sidebar .nav-item span{display:inline;}
  .sidebar .sidebar-foot{padding:14px 20px 4px 20px;text-align:left;font-size:11px;}
  .sidebar .sidebar-foot button span{display:inline;}
  .sidebar-overlay.show{display:block;position:fixed;inset:0;background:rgba(20,25,20,0.42);z-index:65;}
  .hamburger-btn{display:flex;}

  .topbar{padding:10px 14px;flex-wrap:wrap;row-gap:8px;}
  .view-title{font-size:16.5px;}
  .chip{display:none;}
  .topbar-right{width:100%;order:3;gap:6px;}
  .select-branch{flex:1;min-width:0;font-size:12px;padding:6px 8px;}
  .content{padding:12px;}

  .grid-stats{grid-template-columns:repeat(2,1fr);gap:8px;}
  .stat-card{padding:10px 12px;}
  .stat-value{font-size:17px;}

  .cat-tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
  .cat-tab{flex-shrink:0;}
  .product-grid{grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px;padding-bottom:76px;}
  .product-emoji{font-size:26px;}

  .pos-layout{grid-template-columns:1fr;}
  .receipt{display:none;}
  .receipt.mobile-open{
    display:flex;position:fixed;inset:0;z-index:85;max-height:100vh;border-radius:0;top:0;
  }
  .receipt-mobile-close{display:block;}
  .mobile-cart-bar{
    display:flex;position:fixed;left:12px;right:12px;bottom:14px;z-index:40;
    background:var(--pine);color:var(--cream);border-radius:30px;padding:12px 18px;
    align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,0.28);border:none;
  }
  .mobile-cart-bar .mcb-info{font-size:12.5px;text-align:left;}
  .mobile-cart-bar .mcb-total{font-family:var(--font-mono);font-weight:700;font-size:14.5px;}

  .modal-box{max-width:100%;}
  table{font-size:12px;}
}
@media (min-width: 769px){
  .mobile-cart-bar{display:none !important;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============================= UTIL ============================= */
const COFFEE_LOGO = (size) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"/><path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c-.6 1 .5 1.5 0 2.6M12.2 3c-.6 1 .5 1.5 0 2.6"/></svg>`;
const uid = (p='ID') => p + '-' + Date.now().toString(36).slice(-6) + Math.random().toString(36).slice(2,6);
const fmt = n => 'Rp' + Math.round(n||0).toLocaleString('id-ID');
const todayISO = () => new Date().toISOString().slice(0,10);
const nowISO = () => new Date().toISOString();
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg;

function friendlyFetchError(e){
  const msg = (e && e.message) || String(e);
  if(msg==='Failed to fetch' || msg.includes('NetworkError') || msg.includes('Load failed')){
    return 'Koneksi ke server diblokir sebelum sampai ke tujuan — biasanya karena file ini dibuka di dalam preview claude.ai, yang membatasi koneksi keluar. Download file ini lalu buka langsung di browser Anda (atau hosting sendiri), bukan dari dalam preview.';
  }
  return msg;
}

/* ---- Sesi login (akun pemilik bisnis) ---- */
function loadAuthSession(){
  try{
    const raw = localStorage.getItem('kasirin_auth_session');
    if(raw) authSession = JSON.parse(raw);
  }catch(e){ authSession = null; }
}
function saveAuthSessionFromResponse(resp){
  if(!resp || !resp.access_token || !resp.user) return null;
  const prevBusinessId = authSession && authSession.business_id;
  const s = {
    access_token: resp.access_token,
    refresh_token: resp.refresh_token,
    expires_at: Date.now() + ((resp.expires_in||3600)*1000) - 30000,
    user_id: resp.user.id,
    email: resp.user.email,
    business_id: prevBusinessId || null,
  };
  authSession = s;
  try{ localStorage.setItem('kasirin_auth_session', JSON.stringify(s)); }catch(e){}
  return s;
}
function persistSession(){
  if(!authSession) return;
  try{ localStorage.setItem('kasirin_auth_session', JSON.stringify(authSession)); }catch(e){}
}
function isOwnerSession(){
  return !!(authSession && authSession.business_id && authSession.business_id===authSession.user_id);
}
function clearAuthSession(){
  authSession = null;
  try{ localStorage.removeItem('kasirin_auth_session'); }catch(e){}
}
async function ensureFreshSession(){
  if(!authSession) return false;
  if(Date.now() < authSession.expires_at) return true;
  try{
    const resp = await gotrueFetch('/auth/v1/token?grant_type=refresh_token', {
      method:'POST', body: JSON.stringify({ refresh_token: authSession.refresh_token }),
    });
    if(resp && resp.access_token){ saveAuthSessionFromResponse(resp); return true; }
    // Respon tidak berisi token tapi juga tidak error -> anggap sesi memang tidak valid lagi
    clearAuthSession();
    return false;
  }catch(e){
    console.warn('Gagal memperbarui sesi:', e);
    const msg = (e && e.message) || String(e);
    const isNetworkIssue = /Failed to fetch|NetworkError|Load failed/i.test(msg);
    const isGenuinelyInvalid = /invalid|expired|revoked|not.?found/i.test(msg) && !isNetworkIssue;
    if(isGenuinelyInvalid){
      // Sesi memang sudah tidak berlaku (mis. di-invalidasi dari perangkat lain) -> baru logout paksa
      clearAuthSession();
    }
    // Kalau penyebabnya jaringan/preview yang memblokir, JANGAN hapus sesi —
    // biarkan aplikasi tetap memakai data tersimpan lokal sampai bisa
    // tersambung lagi, supaya tidak ada yang tiba-tiba ter-logout total
    // hanya gara-gara koneksi sempat putus.
    return false;
  }
}

/* ---- Panggilan mentah ke Supabase (Auth & REST), tanpa CDN pihak ketiga ---- */
async function gotrueFetch(path, options){
  const res = await fetch(SUPABASE_URL.replace(/\/$/,'') + path, Object.assign({}, options, {
    headers: Object.assign({ 'apikey': SUPABASE_ANON_KEY, 'Content-Type':'application/json' }, (options&&options.headers)||{}),
  }));
  const text = await res.text();
  let json = null; if(text){ try{ json = JSON.parse(text); }catch(e){} }
  if(!res.ok){
    const msg = (json && (json.error_description || json.msg || json.message || json.error)) || text || ('HTTP '+res.status);
    throw new Error(msg);
  }
  return json;
}
async function authSignUp(email, password){ return gotrueFetch('/auth/v1/signup', { method:'POST', body: JSON.stringify({ email, password }) }); }
async function authSignIn(email, password){ return gotrueFetch('/auth/v1/token?grant_type=password', { method:'POST', body: JSON.stringify({ email, password }) }); }

async function bizFetch(path, options){
  const ok = await ensureFreshSession();
  if(!ok) throw new Error('Sesi berakhir, silakan masuk lagi.');
  const res = await fetch(SUPABASE_URL.replace(/\/$/,'') + path, Object.assign({}, options, {
    headers: Object.assign({
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + authSession.access_token,
      'Content-Type': 'application/json',
    }, (options&&options.headers)||{}),
  }));
  const text = await res.text();
  let json = null; if(text){ try{ json = JSON.parse(text); }catch(e){} }
  if(!res.ok){
    const msg = (json && (json.message || json.error || json.hint || json.details)) || text || ('HTTP '+res.status);
    throw new Error(msg);
  }
  return json;
}
async function resolveMyBusinessId(){
  // 1) Coba sebagai pemilik langsung (id baris = uid sendiri)
  try{
    const rows = await bizFetch('/rest/v1/businesses?id=eq.' + authSession.user_id + '&select=id', { method:'GET' });
    if(Array.isArray(rows) && rows.length) return authSession.user_id;
  }catch(e){ /* lanjut coba sebagai anggota */ }
  // 2) Coba sebagai anggota (login perangkat yang dibuatkan Admin)
  try{
    const rows = await bizFetch('/rest/v1/business_members?user_id=eq.' + authSession.user_id + '&select=business_id&limit=1', { method:'GET' });
    if(Array.isArray(rows) && rows.length && rows[0].business_id) return rows[0].business_id;
  }catch(e){ /* tidak ketemu juga */ }
  return null;
}
async function fetchBusinessRow(){
  if(!authSession.business_id){
    authSession.business_id = await resolveMyBusinessId();
    persistSession();
  }
  if(!authSession.business_id) throw new Error('Akun ini belum terhubung ke bisnis manapun.');
  const json = await bizFetch('/rest/v1/businesses?id=eq.' + authSession.business_id + '&select=data,updated_at', { method:'GET' });
  return Array.isArray(json) ? json[0] : json;
}
async function upsertBusinessRow(stateObj){
  if(!authSession.business_id){
    authSession.business_id = await resolveMyBusinessId();
    persistSession();
  }
  if(!authSession.business_id) throw new Error('Akun ini belum terhubung ke bisnis manapun.');
  await bizFetch('/rest/v1/businesses', {
    method:'POST',
    headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify([{ id: authSession.business_id, data: stateObj, updated_at: new Date().toISOString() }]),
  });
  return true;
}

/* Sinkron antar-device lewat polling ringan (bukan websocket) — supaya tidak
   perlu dependensi luar apa pun, cukup fetch() biasa yang jauh lebih andal
   dijalankan di dalam sandbox preview. */
function startBizPolling(){
  if(pollTimer || !authSession) return;
  pollTimer = setInterval(async () => {
    if(!authSession){ stopBizPolling(); return; }
    try{
      const row = await fetchBusinessRow();
      if(row && row.updated_at && row.updated_at !== lastKnownUpdatedAt && !saveTimer){
        lastKnownUpdatedAt = row.updated_at;
        state = row.data; normalizeState(state);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
        if(!isLocked) renderShell();
      }
    }catch(e){ /* koneksi sempat gagal, coba lagi di polling berikutnya */ }
  }, 4000);
}
function stopBizPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

function hasCloudStorage(){
  return typeof window!=='undefined' && window.storage && typeof window.storage.get==='function' && typeof window.storage.set==='function';
}
async function storageGetRaw(){
  if(authSession){
    try{
      const row = await fetchBusinessRow();
      storageMode = 'supabase'; lastSupabaseError='';
      if(row && row.data){ lastKnownUpdatedAt = row.updated_at; return JSON.stringify(row.data); }
      return null;
    }catch(e){
      console.warn('Ambil data bisnis gagal, coba cadangan lain:', e);
      lastSupabaseError = friendlyFetchError(e);
    }
  }
  if(hasCloudStorage()){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && typeof res.value==='string'){ storageMode='cloud'; return res.value; }
    }catch(e){ console.warn('window.storage.get gagal, coba localStorage sebagai cadangan:', e); }
  }
  try{
    const v = localStorage.getItem(STORAGE_KEY);
    storageMode = 'local';
    return v;
  }catch(e){ console.warn('localStorage juga tidak tersedia:', e); storageMode='none'; return null; }
}
async function storageSetRaw(value){
  if(authSession){
    try{
      const obj = JSON.parse(value);
      await upsertBusinessRow(obj);
      storageMode = 'supabase'; lastSupabaseError=''; lastKnownUpdatedAt = new Date().toISOString();
      try{ localStorage.setItem(STORAGE_KEY, value); }catch(e){} // cadangan offline
      return true;
    }catch(e){
      console.warn('Simpan ke server gagal, coba cadangan lain:', e);
      lastSupabaseError = friendlyFetchError(e);
    }
  }
  if(hasCloudStorage()){
    try{ const r = await window.storage.set(STORAGE_KEY, value, false); if(r){ storageMode='cloud'; return true; } }
    catch(e){ console.warn('window.storage.set gagal, memakai localStorage sebagai cadangan:', e); }
  }
  try{ localStorage.setItem(STORAGE_KEY, value); storageMode='local'; return true; }
  catch(e){ console.error('Gagal menyimpan data (localStorage pun gagal):', e); storageMode='none'; return false; }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{ await storageSetRaw(JSON.stringify(state)); updateStorageBadge(); }
    catch(e){ console.error('save failed', e); }
  }, 350);
}
function mutate(fn){ fn(state); scheduleSave(); renderView(); }
function updateStorageBadge(){
  const el = document.getElementById('storageBadge');
  if(!el) return;
  if(storageMode==='supabase') el.innerHTML = '<span style="color:#8FCB9E;">●</span> Tersambung (' + esc(authSession?.email||'') + ')';
  else if(storageMode==='cloud') el.innerHTML = '<span style="color:#8FCB9E;">●</span> Tersimpan di cloud Claude';
  else if(storageMode==='local'){
    el.innerHTML = '<span style="color:#E0C070;">●</span> Tersimpan lokal (perangkat ini saja)';
    if(authSession && lastSupabaseError){
      el.innerHTML += `<div style="color:#E08070;margin-top:3px;">Sinkron gagal: ${esc(lastSupabaseError)}</div>`;
    }
  }
  else if(storageMode==='none') el.innerHTML = '<span style="color:#E08070;">●</span> Gagal menyimpan — data bisa hilang';
  else el.innerHTML = '';
}

function normalizeState(s){
  if(!s.businessName) s.businessName = 'Kasirin';
  if(s.tagline==null) s.tagline = '';
  if(!s.receivables) s.receivables=[];
  if(!s.stockMovements) s.stockMovements=[];
  if(!s.settings) s.settings={currentBranchId:'BR-1',currentEmployeeId:'EMP-2',currentShiftId:null,qrisBackendUrl:''};
  if(s.settings.qrisBackendUrl==null) s.settings.qrisBackendUrl='';
  if(!s.posState) s.posState={category:'Semua',search:'',cart:[],discount:{type:'amount',value:0},note:''};
  return s;
}
async function loadState(){
  try{
    const raw = await storageGetRaw();
    if(raw){ state = JSON.parse(raw); }
    else { state = demoSeedState(); await storageSetRaw(JSON.stringify(state)); }
  }catch(e){
    state = demoSeedState();
    try{ await storageSetRaw(JSON.stringify(state)); }catch(e2){}
  }
  normalizeState(state);
}

function getEmp(id){ return state.employees.find(e=>e.id===id); }
function getBranch(id){ return state.branches.find(b=>b.id===id); }
function getProduct(id){ return state.products.find(p=>p.id===id); }
function getCustomer(id){ return state.customers.find(c=>c.id===id); }
function currentShift(){ return state.shifts.find(s=>s.id===state.settings.currentShiftId && s.status==='open'); }
function cartSubtotal(){ return state.posState.cart.reduce((a,l)=>a+l.price*l.qty,0); }
function cartDiscountAmt(){
  const d = state.posState.discount; const sub = cartSubtotal();
  if(!d || !d.value) return 0;
  return d.type==='percent' ? Math.round(sub*d.value/100) : Math.min(d.value, sub);
}
function cartTotal(){ return Math.max(0, cartSubtotal() - cartDiscountAmt()); }

function addToCart(pid){
  if(!currentShift()){ toast('Buka shift terlebih dahulu.'); return; }
  const p = getProduct(pid); if(!p || p.stock<=0) return;
  mutate(s=>{
    const line = s.posState.cart.find(l=>l.productId===pid);
    const already = line? line.qty:0;
    if(already+1 > p.stock){ toast('Stok tidak cukup.'); return; }
    if(line) line.qty++;
    else s.posState.cart.push({productId:p.id, name:p.name, price:p.price, cost:p.cost, qty:1});
  });
}
function changeQty(pid, delta){
  mutate(s=>{
    const line = s.posState.cart.find(l=>l.productId===pid);
    if(!line) return;
    const p = getProduct(pid);
    const nq = line.qty+delta;
    if(nq<=0){ s.posState.cart = s.posState.cart.filter(l=>l.productId!==pid); return; }
    if(p && nq>p.stock){ toast('Stok tidak cukup.'); return; }
    line.qty = nq;
  });
}
function removeFromCart(pid){ mutate(s=>{ s.posState.cart = s.posState.cart.filter(l=>l.productId!==pid); }); }
function clearCart(){ if(!confirm('Batalkan seluruh item di keranjang?')) return; mutate(s=>{ s.posState.cart=[]; s.posState.discount={type:'amount',value:0}; }); mobileCartOpen=false; }

function setDiscountValue(v){ mutate(s=>{ s.posState.discount.value=Number(v)||0; }); }

async function createDeviceLogin(){
  const label = document.getElementById('dl_label').value.trim();
  const email = document.getElementById('dl_email').value.trim();
  const pass = document.getElementById('dl_pass').value;
  const out = document.getElementById('dlResult');
  if(!email || !pass){ out.style.color='var(--rust)'; out.textContent = 'Isi email dan password baru.'; return; }
  if(pass.length<6){ out.style.color='var(--rust)'; out.textContent = 'Password minimal 6 karakter.'; return; }
  out.style.color='var(--ink-soft)'; out.textContent = 'Membuat login...';
  try{
    const res = await fetch(SUPABASE_URL.replace(/\/$/,'') + '/functions/v1/create-device-login', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + authSession.access_token,
      },
      body: JSON.stringify({ email, password: pass, label }),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.ok){ throw new Error(data.error || ('HTTP '+res.status)); }
    out.style.color='var(--green)';
    out.textContent = '✓ Login berhasil dibuat. Bagikan email & password ini ke perangkat kasir tujuan.';
    document.getElementById('dl_label').value='';
    document.getElementById('dl_email').value='';
    document.getElementById('dl_pass').value='';
  }catch(e){
    out.style.color='var(--rust)';
    out.textContent = friendlyFetchError(e);
  }
}

function paymentQRIS(){
  const backendUrl = (state.settings.qrisBackendUrl||'').trim();
  if(!backendUrl){ paymentQRISSimulated(); return; }

  qrisOrderId = 'TC' + Date.now().toString(36).toUpperCase();
  openModal(`

    </div>
  `);

async function createRealQris(backendUrl){
  try{
    const items = state.posState.cart.map(l=>({id:l.productId, price:l.price, quantity:l.qty, name:l.name.slice(0,50)}));
    const disc = cartDiscountAmt();
    if(disc>0) items.push({id:'DISKON', price:-disc, quantity:1, name:'Diskon'});
    const res = await fetch(backendUrl + '/api/qris/create', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ order_id: qrisOrderId, gross_amount: cartTotal(), item_details: items })
    });
    const data = await res.json();
    if(!res.ok || !data.qr_url) throw new Error(data.error || 'Gagal membuat kode QRIS.');
    const c = document.getElementById('qrisContent');
    if(c) c.innerHTML = `<img src="${data.qr_url}" alt="Kode QRIS" style="width:220px;height:220px;border:1px solid var(--line-strong);border-radius:8px;">`;
    const note = document.getElementById('qrisStatusNote');
    if(note) note.textContent = 'Menunggu pelanggan menyelesaikan pembayaran...';
    qrisPollTimer = setInterval(()=>pollQrisStatus(backendUrl), 3000);
  }catch(e){
    const c = document.getElementById('qrisContent');
    if(c) c.innerHTML = `<div style="color:var(--rust);padding:16px 0;font-size:12.5px;">Gagal terhubung ke backend QRIS.<br>${esc(e.message||'')}<br><br>Periksa URL backend di ⚙️ Pengaturan Pembayaran.</div>`;
  }
}
async function pollQrisStatus(backendUrl){
  try{
    const res = await fetch(backendUrl + '/api/qris/status/' + encodeURIComponent(qrisOrderId));
    const data = await res.json();
    if(data.transaction_status==='settlement'){
      clearInterval(qrisPollTimer); qrisPollTimer=null;
      const trx = finalizeTransaction('QRIS', cartTotal(), 0, null);
      showReceipt(trx);
    } else if(['expire','deny','cancel'].includes(data.transaction_status)){
      clearInterval(qrisPollTimer); qrisPollTimer=null;
      const note = document.getElementById('qrisStatusNote');
      if(note) note.textContent = 'Pembayaran kedaluwarsa atau gagal. Tutup dan coba lagi.';
    }
  }catch(e){ /* koneksi sempat gagal, coba lagi di polling berikutnya */ }
}
function cancelQrisPayment(){
  if(qrisPollTimer){ clearInterval(qrisPollTimer); qrisPollTimer=null; }
  qrisOrderId = null;

function finalizeTransaction(method, cashReceived, change, customerId, status){
  let trx;
  mutate(s=>{
    s.trxCounter++;
    const sub = cartSubtotal(); const disc = cartDiscountAmt(); const total = cartTotal();
    trx = {
      id: uid('TRX'), trxNumber:'TRX-'+String(s.trxCounter).padStart(5,'0'),
      branchId: s.settings.currentBranchId, employeeId: s.settings.currentEmployeeId, shiftId: s.settings.currentShiftId,
      items: s.posState.cart.map(l=>({productId:l.productId,name:l.name,price:l.price,cost:l.cost,qty:l.qty})),
      subtotal: sub, discount: disc, total, paymentMethod: method, cashReceived, change,
      customerId, status: status||'completed', createdAt: nowISO(),
    };
    s.transactions.push(trx);
    trx.items.forEach(it=>{
      const p = s.products.find(pp=>pp.id===it.productId);
      if(p) p.stock = Math.max(0, p.stock - it.qty);
    });
    s.posState.cart=[]; s.posState.discount={type:'amount',value:0};
  });
  mobileCartOpen = false;
  return trx;
}

function recordStockMovement(){
  const productId = document.getElementById('sm_product').value;
  const type = document.getElementById('sm_type').value;
  const qty = Number(document.getElementById('sm_qty').value)||0;
  const note = document.getElementById('sm_note').value.trim();
  const p = getProduct(productId);
  if(!p){ toast('Pilih produk terlebih dahulu.'); return; }
  if(qty<=0){ toast('Jumlah harus lebih dari 0.'); return; }
  const meta = STOCK_MOVE_TYPES[type];
  if(meta.sign<0 && qty>p.stock){ toast(`Stok tidak cukup — stok saat ini hanya ${p.stock}.`); return; }
  mutate(s=>{
    const prod = s.products.find(x=>x.id===productId);
    if(!prod) return;
    prod.stock += meta.sign*qty;
    s.stockMovements.push({
      id: uid('SM'), productId, productName: prod.name, type, qty, note,
      employeeId: s.settings.currentEmployeeId, branchId: s.settings.currentBranchId, createdAt: nowISO(),
    });
  });
  toast('Pergerakan stok dicatat.');
}
function deleteStockMovement(id){
  if(!isAdmin()){ toast('Hanya Admin yang bisa menghapus catatan stok.'); return; }
  const m = state.stockMovements.find(x=>x.id===id);
  if(!m) return;
  if(!confirm('Hapus catatan ini? Perubahan stok akan dibatalkan (dikembalikan seperti sebelum pencatatan ini).')) return;
  mutate(s=>{
    const mv = s.stockMovements.find(x=>x.id===id);
    if(!mv) return;
    const meta = STOCK_MOVE_TYPES[mv.type];
    const prod = s.products.find(p=>p.id===mv.productId);
    if(prod) prod.stock -= meta.sign*mv.qty;
    s.stockMovements = s.stockMovements.filter(x=>x.id!==id);
  });
  toast('Catatan stok dihapus, stok dikembalikan.');
}

function renameCategoryPrompt(idx){
  if(!isAdmin()) return;
  const oldName = state.categories[idx];

  const input = prompt('Ubah nama kategori "'+oldName+'" menjadi:', oldName);

  if(!newName || newName===oldName) return;
  if(state.categories.includes(newName)){ toast('Nama kategori sudah dipakai.'); return; }
  mutate(s=>{
    const i = s.categories.indexOf(oldName);
    if(i>-1) s.categories[i]=newName;
    s.products.forEach(p=>{ if(p.category===oldName) p.category=newName; });

  openCategoryManager();

  if(state.categories.length<=1){ toast('Minimal harus ada satu kategori.'); return; }

  mutate(s=>{ s.categories = s.categories.filter(c=>c!==name); });

/* ============================= DASHBOARD (Admin) ============================= */
let dashboardFilters = { branch:'Semua', category:'Semua', product:'Semua' };
const DASH_PALETTE = ['#5B7A52','#BC7A32','#A1432B','#6B5541','#8B9DC3','#C9A66B','#3F6B5C','#8C5A3C'];

function flattenSales(){
  const rows = [];
  state.transactions.filter(t=>t.status!=='held').forEach(t=>{
    t.items.forEach(it=>{
      const p = getProduct(it.productId);
      rows.push({
        branchId: t.branchId,
        category: p? p.category : 'Lainnya',
        productId: it.productId,
        productName: it.name,
        qty: it.qty,
        revenue: it.price*it.qty,
        date: t.createdAt.slice(0,10),
      });
    });
  });
  return rows;
}
function dashboardRows(){
  let rows = flattenSales();
  const f = dashboardFilters;
  if(f.branch!=='Semua') rows = rows.filter(r=>r.branchId===f.branch);
  if(f.category!=='Semua') rows = rows.filter(r=>r.category===f.category);
  if(f.product!=='Semua') rows = rows.filter(r=>r.productId===f.product);
  return rows;
}
function dashboardProductList(){
  const f = dashboardFilters;
  let list = state.products;
  if(f.category!=='Semua') list = list.filter(p=>p.category===f.category);
  if(f.product!=='Semua') list = list.filter(p=>p.id===f.product);
  return list;
}
function viewDashboard(){
  const rows = dashboardRows();
  const totalQty = rows.reduce((a,r)=>a+r.qty,0);
  const totalRevenue = rows.reduce((a,r)=>a+r.revenue,0);
  return `
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:18px;">
      <div style="display:flex;gap:28px;flex-wrap:wrap;">
        <div>
          <div class="stat-label">QTY TERJUAL</div>
          <div class="stat-value" style="font-size:26px;">${totalQty}</div>
        </div>
        <div>
          <div class="stat-label">TOTAL PENJUALAN</div>
          <div class="stat-value" style="font-size:26px;color:var(--green);">${fmt(totalRevenue)}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select class="select-branch" onchange="setDashFilter('branch',this.value)">
          <option value="Semua" ${dashboardFilters.branch==='Semua'?'selected':''}>Cabang: Semua</option>
          ${state.branches.map(b=>`<option value="${b.id}" ${dashboardFilters.branch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select>
        <select class="select-branch" onchange="setDashFilter('category',this.value)">
          <option value="Semua" ${dashboardFilters.category==='Semua'?'selected':''}>Kategori: Semua</option>
          ${state.categories.map(c=>`<option value="${esc(c)}" ${dashboardFilters.category===c?'selected':''}>${esc(c)}</option>`).join('')}
        </select>
        <select class="select-branch" onchange="setDashFilter('product',this.value)">
          <option value="Semua" ${dashboardFilters.product==='Semua'?'selected':''}>Produk: Semua</option>
          ${state.products.map(p=>`<option value="${p.id}" ${dashboardFilters.product===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1.6fr;gap:16px;margin-bottom:16px;">
      <div class="card">
        <div style="font-weight:600;font-size:13.5px;margin-bottom:10px;">Perbandingan Penjualan per Kategori</div>
        <canvas id="dashPieChart" height="220"></canvas>
      </div>
      <div class="card" style="background:var(--green-soft);">
        <div style="font-weight:600;font-size:13.5px;margin-bottom:10px;">Tren Penjualan per Tanggal</div>
        <canvas id="dashAreaChart" height="180"></canvas>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div style="font-weight:600;font-size:13.5px;margin-bottom:2px;">Penjualan per Produk (Jumlah Terjual)</div>
      <div style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">${dashboardProductList().length} produk · geser ke samping kalau tidak muat</div>
      <div style="overflow-x:auto;">
        <canvas id="dashProductChart" height="110" style="min-width:${Math.max(600, dashboardProductList().length*65)}px;"></canvas>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:600;font-size:13.5px;margin-bottom:10px;">Pendapatan per Cabang</div>
      <canvas id="dashBranchChart" height="${Math.max(80, state.branches.length*50)}"></canvas>
    </div>
  `;
}
function setDashFilter(k,v){ dashboardFilters[k]=v; renderView(); }

let dashPie=null, dashArea=null, dashProduct=null, dashBranch=null;
function drawDashboardCharts(){
  if(!window.Chart) return;
  const rows = dashboardRows();

  // ---- Pie: qty per kategori ----
  const catAgg = {};
  rows.forEach(r=>{ catAgg[r.category] = (catAgg[r.category]||0) + r.qty; });
  const catLabels = Object.keys(catAgg);
  const catData = catLabels.map(k=>catAgg[k]);
  const pieCanvas = document.getElementById('dashPieChart');
  if(pieCanvas){
    if(dashPie) dashPie.destroy();
    dashPie = new Chart(pieCanvas.getContext('2d'), {
      type:'pie',
      data:{ labels:catLabels, datasets:[{ data:catData, backgroundColor: catLabels.map((_,i)=>DASH_PALETTE[i%DASH_PALETTE.length]) }] },
      options:{ plugins:{ legend:{ position:'right', labels:{ boxWidth:12, font:{size:11} } } } }
    });
  }

  // ---- Area: tren pendapatan per tanggal (14 hari terakhir) ----
  const days=14; const labels=[]; const data=[];
  for(let d=days-1; d>=0; d--){
    const day = new Date(); day.setDate(day.getDate()-d);
    const key = day.toISOString().slice(0,10);
    labels.push(day.toLocaleDateString('id-ID',{day:'2-digit',month:'short'}));
    data.push(rows.filter(r=>r.date===key).reduce((a,r)=>a+r.revenue,0));
  }
  const areaCanvas = document.getElementById('dashAreaChart');
  if(areaCanvas){
    if(dashArea) dashArea.destroy();
    dashArea = new Chart(areaCanvas.getContext('2d'), {
      type:'line',
      data:{ labels, datasets:[{ label:'Pendapatan', data, borderColor:'#3F6B5C', backgroundColor:'rgba(63,107,92,0.35)', fill:true, tension:0.3, pointRadius:2 }]},
      options:{ plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ callback:v=>'Rp'+(v/1000)+'rb' } }, x:{ grid:{display:false} } } }
    });
  }

  // ---- Kolom: qty terjual per produk (SEMUA produk sesuai data produk) ----
  const qtyByProduct = {};
  rows.forEach(r=>{ qtyByProduct[r.productId] = (qtyByProduct[r.productId]||0) + r.qty; });
  const prodSorted = dashboardProductList()
    .map(p=>({ name:p.name, qty: qtyByProduct[p.id]||0 }))
    .sort((a,b)=>b.qty-a.qty);
  const prodCanvas = document.getElementById('dashProductChart');
  if(prodCanvas){
    if(dashProduct) dashProduct.destroy();
    dashProduct = new Chart(prodCanvas.getContext('2d'), {
      type:'bar',
      data:{ labels: prodSorted.map(p=>p.name), datasets:[{ label:'Qty Terjual', data: prodSorted.map(p=>p.qty), backgroundColor:'#6B5541' }] },
      options:{ maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } }, x:{ ticks:{ autoSkip:false, maxRotation:60, minRotation:30 } } } }
    });
  }

  // ---- Batang horizontal: pendapatan per cabang ----
  const brAgg = {};
  state.branches.forEach(b=>{ brAgg[b.id]=0; });
  rows.forEach(r=>{ brAgg[r.branchId] = (brAgg[r.branchId]||0) + r.revenue; });
  const brLabels = state.branches.map(b=>b.name);
  const brData = state.branches.map(b=>brAgg[b.id]||0);
  const brCanvas = document.getElementById('dashBranchChart');
  if(brCanvas){
    if(dashBranch) dashBranch.destroy();
    dashBranch = new Chart(brCanvas.getContext('2d'), {
      type:'bar',
      data:{ labels: brLabels, datasets:[{ label:'Pendapatan', data: brData, backgroundColor:'#6B5541' }] },
      options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{ x:{ ticks:{ callback:v=>'Rp'+(v/1000)+'rb' } } } }
    });
  }
}

/* ============================= REPORTS ============================= */
let reportRange = 7;
function filteredTrx(days){
  const cutoff = days==='all'? 0 : Date.now() - days*86400000;
  return state.transactions.filter(t=> new Date(t.createdAt).getTime() >= cutoff && t.status!=='held');
}
function viewReports(){
  const trx = filteredTrx(reportRange);
  const omzet = trx.reduce((a,t)=>a+t.total,0);
  const count = trx.length;
  const avg = count? omzet/count : 0;
  const profit = trx.reduce((a,t)=> a + t.items.reduce((b,it)=>b+(it.price-it.cost)*it.qty,0) - t.discount, 0);

  const prodAgg = {};
  trx.forEach(t=>t.items.forEach(it=>{
    if(!prodAgg[it.productId]) prodAgg[it.productId]={name:it.name,qty:0,revenue:0};
    prodAgg[it.productId].qty+=it.qty; prodAgg[it.productId].revenue+=it.price*it.qty;
  }));
  const topProducts = Object.values(prodAgg).sort((a,b)=>b.qty-a.qty).slice(0,5);

  const kasirAgg = {};
  trx.forEach(t=>{
    if(!kasirAgg[t.employeeId]) kasirAgg[t.employeeId]={count:0,omzet:0};
    kasirAgg[t.employeeId].count++; kasirAgg[t.employeeId].omzet+=t.total;
  });
  const kasirRows = Object.entries(kasirAgg).map(([id,v])=>({name:getEmp(id)?.name||id, ...v})).sort((a,b)=>b.omzet-a.omzet);

  return `
    <div class="section-head">
      <h2>Ringkasan Penjualan</h2>
      <div class="tabs" style="border:none;margin:0;">
        ${[[1,'Hari Ini'],[7,'7 Hari'],[30,'30 Hari'],['all','Semua']].map(([v,l])=>`<button class="tab-btn ${reportRange===v?'active':''}" onclick="setReportRange('${v}')">${l}</button>`).join('')}
      </div>
    </div>
    <div class="grid-stats">
      <div class="stat-card"><div class="stat-label">Omzet</div><div class="stat-value">${fmt(omzet)}</div></div>
      <div class="stat-card"><div class="stat-label">Total Transaksi</div><div class="stat-value">${count}</div></div>
      <div class="stat-card"><div class="stat-label">Rata-rata / Transaksi</div><div class="stat-value">${fmt(avg)}</div></div>
      <div class="stat-card"><div class="stat-label">Profit Bersih</div><div class="stat-value" style="color:var(--green)">${fmt(profit)}</div></div>
    </div>
    <div class="card" style="margin-bottom:18px;">
      <div style="font-weight:600;font-size:13.5px;margin-bottom:10px;">Tren Penjualan</div>
      <canvas id="trendChart" height="90"></canvas>
    </div>
    <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:16px;">
      <div>
        <div style="font-weight:600;font-size:13.5px;margin-bottom:8px;">Produk Terlaris</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Produk</th><th>Qty Terjual</th><th>Omzet</th></tr></thead>
          <tbody>${topProducts.length? topProducts.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.qty}</td><td class="mono">${fmt(p.revenue)}</td></tr>`).join(''):'<tr><td colspan="3" style="text-align:center;color:var(--ink-soft);">Belum ada data</td></tr>'}</tbody>
        </table></div>
      </div>
      <div>
        <div style="font-weight:600;font-size:13.5px;margin-bottom:8px;">Performa Kasir</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Kasir</th><th>Trx</th><th>Omzet</th></tr></thead>
          <tbody>${kasirRows.length? kasirRows.map(k=>`<tr><td>${esc(k.name)}</td><td>${k.count}</td><td class="mono">${fmt(k.omzet)}</td></tr>`).join(''):'<tr><td colspan="3" style="text-align:center;color:var(--ink-soft);">Belum ada data</td></tr>'}</tbody>
        </table></div>
      </div>
    </div>
  `;
}
function setReportRange(v){ reportRange = v==='all'?'all':Number(v); renderView(); }
let chartInst=null;
function drawReportsChart(){
  const canvas = document.getElementById('trendChart'); if(!canvas || !window.Chart) return;
  const days = reportRange==='all'? 30 : reportRange;
  const labels=[]; const data=[];
  for(let d=days-1; d>=0; d--){
    const day = new Date(); day.setDate(day.getDate()-d);
    const key = day.toISOString().slice(0,10);
    labels.push(day.toLocaleDateString('id-ID',{day:'2-digit',month:'short'}));
    const sum = state.transactions.filter(t=>t.status!=='held' && t.createdAt.slice(0,10)===key).reduce((a,t)=>a+t.total,0);
    data.push(sum);
  }
  if(chartInst) chartInst.destroy();
  chartInst = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels, datasets:[{ label:'Omzet', data, borderColor:'#C08A22', backgroundColor:'rgba(192,138,34,0.12)', fill:true, tension:0.3, pointRadius:2 }]},
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ticks:{callback:v=>'Rp'+(v/1000)+'rb'}}, x:{grid:{display:false}} } }
  });
}

/* ============================= RECEIVABLES ============================= */
let recFilter='Semua';
function receivableStatus(r){
  const rem = r.amount - r.paid;
  if(rem<=0) return 'Lunas';
  if(r.paid>0) return 'Sebagian';
  return 'Belum Lunas';
}
function viewReceivables(){
  let recs = state.receivables;
  if(recFilter!=='Semua') recs = recs.filter(r=>receivableStatus(r)===recFilter);
  const totalOutstanding = state.receivables.reduce((a,r)=>a+Math.max(0,r.amount-r.paid),0);
  return `
    <div class="grid-stats">
      <div class="stat-card"><div class="stat-label">Total Piutang Belum Lunas</div><div class="stat-value" style="color:var(--rust)">${fmt(totalOutstanding)}</div></div>
      <div class="stat-card"><div class="stat-label">Jumlah Pelanggan Berutang</div><div class="stat-value">${new Set(state.receivables.filter(r=>receivableStatus(r)!=='Lunas').map(r=>r.customerId)).size}</div></div>
      <div class="stat-card"><div class="stat-label">Total Catatan</div><div class="stat-value">${state.receivables.length}</div></div>
    </div>
    <div class="section-head">
      <h2>Buku Piutang</h2>
      <button class="btn btn-primary" onclick="openReceivableForm()">+ Catat Piutang</button>
    </div>
    <div class="tabs">
      ${['Semua','Belum Lunas','Sebagian','Lunas'].map(f=>`<button class="tab-btn ${recFilter===f?'active':''}" onclick="setRecFilter('${f}')">${f}</button>`).join('')}
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Pelanggan</th><th>Total</th><th>Terbayar</th><th>Sisa</th><th>Jatuh Tempo</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${recs.length? recs.map(r=>{
            const st=receivableStatus(r); const cust=getCustomer(r.customerId);
            const tagClass = st==='Lunas'?'tag-green':st==='Sebagian'?'tag-gold':'tag-rust';
            const overdue = new Date(r.dueDate) < new Date() && st!=='Lunas';
            return `<tr>
              <td style="font-weight:600;">${esc(cust?.name||'—')}</td>
              <td class="mono">${fmt(r.amount)}</td>
              <td class="mono">${fmt(r.paid)}</td>
              <td class="mono">${fmt(Math.max(0,r.amount-r.paid))}</td>
              <td>${fmtDate(r.dueDate)} ${overdue?'<span class="tag tag-rust">Lewat</span>':''}</td>
              <td><span class="tag ${tagClass}">${st}</span></td>
              <td>
                ${st!=='Lunas'?`<button class="btn btn-sm btn-primary" onclick="openPayReceivable('${r.id}')">Catat Bayar</button>`:''}
                ${isAdmin()?`<button class="btn btn-sm btn-danger" onclick="deleteReceivable('${r.id}')">Hapus</button>`:''}
              </td>
            </tr>`;
          }).join(''):'<tr><td colspan="7" style="text-align:center;color:var(--ink-soft);padding:30px;">Tidak ada data piutang.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}
function setRecFilter(f){ recFilter=f; renderView(); }
function openReceivableForm(){
  openModal(`
    <div class="modal-head"><h3>Catat Piutang Baru</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <label class="field">Pelanggan
        <select id="r_cust">
          ${state.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
          <option value="__new">+ Tambah pelanggan baru</option>
        </select>
      </label>
      <div id="r_newCustBox" style="display:none;"><label class="field">Nama Pelanggan Baru<input type="text" id="r_newCustName"></label></div>
      <div class="field-row">
        <label class="field">Jumlah (Rp)<input type="number" id="r_amount"></label>
        <label class="field">Jatuh Tempo<input type="date" id="r_due" value="${new Date(Date.now()+7*86400000).toISOString().slice(0,10)}"></label>
      </div>
      <label class="field">Catatan<input type="text" id="r_note" placeholder="Opsional"></label>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="saveReceivable()">Simpan</button>
    </div>
  `);
  document.getElementById('r_cust').addEventListener('change', function(){
    document.getElementById('r_newCustBox').style.display = this.value==='__new'?'block':'none';
  });
}
function saveReceivable(){
  const sel = document.getElementById('r_cust').value;
  const amount = Number(document.getElementById('r_amount').value)||0;
  const due = document.getElementById('r_due').value;
  const note = document.getElementById('r_note').value.trim();
  if(!sel || amount<=0){ toast('Lengkapi data piutang.'); return; }
  let custId = sel;
  mutate(s=>{
    if(sel==='__new'){
      const name = document.getElementById('r_newCustName').value.trim();
      if(!name) return;
      custId = uid('C'); s.customers.push({id:custId,name,phone:''});
    }
    s.receivables.push({id:uid('RC'), customerId:custId, amount, paid:0, dueDate:due, createdAt:nowISO(), note});
  });
  closeModal(); toast('Piutang dicatat.');
}
function openPayReceivable(id){
  const r = state.receivables.find(x=>x.id===id); const cust = getCustomer(r.customerId);
  const remaining = r.amount - r.paid;
  openModal(`
    <div class="modal-head"><h3>Catat Pembayaran — ${esc(cust?.name||'')}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="row-between"><span>Sisa Piutang</span><span class="mono">${fmt(remaining)}</span></div>
      <label class="field" style="margin-top:10px;">Jumlah Cicilan / Pembayaran (Rp)<input type="number" id="pay_amount" max="${remaining}"></label>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="confirmPayReceivable('${id}')">Simpan Pembayaran</button>
    </div>
  `);
}
function confirmPayReceivable(id){
  const amt = Number(document.getElementById('pay_amount').value)||0;
  if(amt<=0){ toast('Masukkan jumlah pembayaran.'); return; }
  mutate(s=>{
    const r = s.receivables.find(x=>x.id===id);
    r.paid = Math.min(r.amount, r.paid+amt);
  });
  closeModal(); toast('Pembayaran dicatat.');
}
function deleteReceivable(id){
  if(!isAdmin()){ toast('Hanya Admin yang bisa menghapus catatan piutang.'); return; }
  if(!confirm('Hapus catatan piutang ini? Tindakan ini tidak bisa dibatalkan.')) return;
  mutate(s=>{ s.receivables = s.receivables.filter(r=>r.id!==id); });
  toast('Catatan piutang dihapus.');
}

/* ============================= TEAM & BRANCHES ============================= */

      <button class="tab-btn ${teamTab==='employees'?'active':''}" onclick="setTeamTab('employees')">Karyawan</button>

    ${teamTab==='employees'? teamEmployees() : teamBranches()}
  `;
}
function setTeamTab(t){ teamTab=t; renderView(); }
function teamEmployees(){

    <div class="section-head"><h2>Manajemen Karyawan</h2><button class="btn btn-primary" onclick="openEmpForm()">+ Tambah Karyawan</button></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Nama</th><th>Peran</th><th>Cabang</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${state.employees.map(e=>`
          <tr>
            <td style="font-weight:600;">${esc(e.name)}</td>
            <td><span class="tag ${e.role==='Admin'?'tag-gold':e.role==='Manager'?'tag-green':'tag-grey'}">${e.role}</span></td>
            <td>${esc(getBranch(e.branchId)?.name||'—')}</td>

              <button class="btn btn-sm" onclick='openEmpForm(${JSON.stringify(e.id)})'>Ubah</button>
              <button class="btn btn-sm" onclick="toggleEmpActive('${e.id}')">${e.active?'Nonaktifkan':'Aktifkan'}</button>

function openEmpForm(id){

  openModal(`
    <div class="modal-head"><h3>${e?'Ubah Karyawan':'Tambah Karyawan'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <label class="field">Nama<input type="text" id="e_name" value="${e?esc(e.name):''}"></label>
      <div class="field-row">
        <label class="field">Peran
          <select id="e_role"><option ${e&&e.role==='Admin'?'selected':''}>Admin</option><option ${e&&e.role==='Manager'?'selected':''}>Manager</option><option ${e&&e.role==='Kasir'?'selected':''}>Kasir</option></select>
        </label>
        <label class="field">Cabang
          <select id="e_branch">${state.branches.map(b=>`<option value="${b.id}" ${e&&e.branchId===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>
        </label>
      </div>
      <label class="field">PIN Akses<input type="text" id="e_pin" value="${e?esc(e.pin):''}" maxlength="6"></label>

function openOpenShift(){
  openModal(`

      <label class="field">Kasir

      </label>

        <select id="os_branch">${state.branches.map(b=>`<option value="${b.id}" ${b.id===state.settings.currentBranchId?'selected':''}>${esc(b.name)}</option>`).join('')}</select>
      </label>

      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="confirmOpenShift()">Buka Shift</button>
    </div>
  `);
}
function confirmOpenShift(){
  const employeeId = document.getElementById('os_emp').value;
  const branchId = document.getElementById('os_branch').value;
  const openCash = Number(document.getElementById('os_cash').value)||0;
  const id = uid('SHF');
  mutate(s=>{
    s.shifts.push({id, employeeId, branchId, openCash, openedAt:nowISO(), closedAt:null, closeCash:null, variance:null, status:'open'});
    s.settings.currentShiftId = id; s.settings.currentEmployeeId=employeeId; s.settings.currentBranchId=branchId;
  });
  closeModal(); toast('Shift dibuka.');
}
function openCloseShift(){
  const sh = currentShift();
  const trx = state.transactions.filter(t=>t.shiftId===sh.id);
  const cashSales = trx.filter(t=>t.paymentMethod==='Tunai').reduce((a,t)=>a+t.total,0);
  const expected = sh.openCash + cashSales;
  openModal(`
    <div class="modal-head"><h3>Tutup Shift</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="row-between"><span>Kas Awal</span><span class="mono">${fmt(sh.openCash)}</span></div>
      <div class="row-between"><span>Penjualan Tunai</span><span class="mono">${fmt(cashSales)}</span></div>
      <div class="row-between total"><span>Kas Seharusnya</span><span>${fmt(expected)}</span></div>
      <label class="field" style="margin-top:12px;">Jumlah Kas Aktual (Hitung Fisik)<input type="number" id="cs_cash" oninput="updateVariance(${expected})"></label>
      <div class="row-between" style="font-weight:600;"><span>Selisih</span><span class="mono" id="varianceOut">${fmt(0)}</span></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn btn-danger" onclick="confirmCloseShift('${sh.id}', ${expected})">Tutup Shift</button>
    </div>
  `);
}
function updateVariance(expected){
  const v = Number(document.getElementById('cs_cash').value)||0;
  const variance = v-expected;
  const el = document.getElementById('varianceOut');
  el.textContent = (variance>=0?'+':'')+fmt(variance);
  el.style.color = variance===0? 'inherit' : (variance>0?'var(--green)':'var(--rust)');
}
function confirmCloseShift(id, expected){
  const closeCash = Number(document.getElementById('cs_cash').value)||0;
  mutate(s=>{
    const sh = s.shifts.find(x=>x.id===id);
    sh.closeCash=closeCash; sh.closedAt=nowISO(); sh.variance=closeCash-expected; sh.status='closed';
    s.settings.currentShiftId=null;
  });
  closeModal(); toast('Shift ditutup.');
}

        <option value="Tunai" ${histFilters.method==='Tunai'?'selected':''}>Tunai</option>
        <option value="QRIS" ${histFilters.method==='QRIS'?'selected':''}>QRIS</option>
        <option value="Piutang" ${histFilters.method==='Piutang'?'selected':''}>Piutang</option>
      </select>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>No. TRX</th><th>Waktu</th><th>Cabang</th><th>Kasir</th><th>Metode</th><th>Item</th><th>Total</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${list.length? list.map(t=>`
          <tr>
            <td class="mono">${t.trxNumber}</td>
            <td>${fmtDateTime(t.createdAt)}</td>
            <td>${esc(getBranch(t.branchId)?.name||'-')}</td>
            <td>${esc(getEmp(t.employeeId)?.name||'-')}</td>
            <td>${t.paymentMethod}</td>

            <td class="mono">${fmt(t.total)}</td>
            <td><span class="tag ${t.status==='piutang'?'tag-rust':'tag-green'}">${t.status==='piutang'?'Piutang':'Selesai'}</span></td>
            <td>
              <button class="btn btn-sm" onclick="viewTrxDetail('${t.id}')">Detail</button>
              ${isAdmin()?`<button class="btn btn-sm btn-danger" onclick="deleteTransaction('${t.id}')">Hapus</button>`:''}
            </td>
          </tr>`).join(''):'<tr><td colspan="9" style="text-align:center;color:var(--ink-soft);padding:24px;">Tidak ada transaksi.</td></tr>'}
      </tbody>
    </table></div>
  `;
}
function setHistFilter(k,v){ histFilters[k]=v; renderView(); }
function viewTrxDetail(id){
  const t = state.transactions.find(x=>x.id===id);
  openModal(`
    <div class="modal-head"><h3>Detail ${t.trxNumber}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="row-between"><span>Waktu</span><span>${fmtDateTime(t.createdAt)}</span></div>
      <div class="row-between"><span>Cabang</span><span>${esc(getBranch(t.branchId)?.name)}</span></div>
      <div class="row-between"><span>Kasir</span><span>${esc(getEmp(t.employeeId)?.name)}</span></div>
      <div class="row-between"><span>Metode</span><span>${t.paymentMethod}</span></div>
      <div style="border-top:1px dashed var(--line-strong);margin:10px 0;padding-top:8px;">
        ${t.items.map(it=>`<div class="row-between" style="font-size:12.5px;"><span>${esc(it.name)} x${it.qty}</span><span class="mono">${fmt(it.price*it.qty)}</span></div>`).join('')}
      </div>
      <div class="row-between total"><span>Total</span><span>${fmt(t.total)}</span></div>
    </div>
    <div class="modal-foot">
      ${isAdmin()?`<button class="btn btn-danger" onclick="deleteTransaction('${t.id}')">Hapus Transaksi</button>`:''}
      <button class="btn btn-primary" onclick="closeModal()">Tutup</button>
    </div>
  `);
}
function deleteTransaction(id){
  if(!isAdmin()){ toast('Hanya Admin yang bisa menghapus transaksi.'); return; }
  const t = state.transactions.find(x=>x.id===id);
  if(!t) return;
  if(!confirm(`Hapus transaksi ${t.trxNumber}? Stok produk yang terjual akan dikembalikan otomatis, dan catatan piutang terkait (jika ada) ikut terhapus. Tindakan ini tidak bisa dibatalkan.`)) return;
  mutate(s=>{
    const trx = s.transactions.find(x=>x.id===id);
    if(!trx) return;
    trx.items.forEach(it=>{
      const p = s.products.find(pp=>pp.id===it.productId);
      if(p) p.stock += it.qty;
    });
    if(trx.status==='piutang'){
      s.receivables = s.receivables.filter(r=>r.trxId!==trx.id);
    }
    s.transactions = s.transactions.filter(x=>x.id!==id);
  });
  closeModal();
  toast('Transaksi dihapus, stok dikembalikan.');
}

let isLocked = true;
let loginSelectedEmp = null;
let pinInput = '';

function initials(name){
  return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

function renderLogin(){
  document.title = (state.businessName||'Kasirin') + ' — Kasir & Manajemen Bisnis';
  const app = document.getElementById('app');
  app.innerHTML = `

        ${!authSession? `<div style="text-align:center;margin-top:14px;"><button class="btn btn-ghost btn-sm" style="color:var(--rust);" onclick="exitDemoMode()">← Keluar dari Mode Demo</button></div>` : ''}
      </div>
    </div>`;
  loginSelectedEmp = null; pinInput = '';

}

function renderLoginStep(){
  const step = document.getElementById('loginStep');
  if(!step) return;
  if(!loginSelectedEmp){
    const active = state.employees.filter(e=>e.active);
    step.innerHTML = `
      <div style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:14px;">Pilih akun untuk masuk</div>
      <div class="emp-grid">
        ${active.map(e=>`
          <button class="emp-btn" onclick="selectLoginEmp('${e.id}')">
            <div class="emp-avatar">${initials(e.name)}</div>
            <div class="emp-btn-name">${esc(e.name)}</div>
            <div class="emp-btn-role">${e.role}</div>
          </button>`).join('')}
      </div>
      <div class="login-hint">Hubungi Admin jika akun Anda belum terdaftar atau nonaktif.</div>
    `;
  } else {
    const emp = getEmp(loginSelectedEmp);
    const pinLen = (emp.pin||'0000').length;
    step.innerHTML = `
      <div class="pin-back-row">
        <button onclick="backToEmpSelect()">←</button>
        <div class="pin-emp-avatar">${initials(emp.name)}</div>
        <div>
          <div style="font-size:13px;font-weight:600;">${esc(emp.name)}</div>
          <div style="font-size:11px;color:var(--ink-soft);">${emp.role} · Masukkan PIN</div>
        </div>
      </div>
      <div class="pin-dots" id="pinDots">
        ${Array.from({length:pinLen}).map((_,i)=>`<div class="pin-dot ${i<pinInput.length?'filled':''}" data-i="${i}"></div>`).join('')}
      </div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" onclick="pinPress('${n}')">${n}</button>`).join('')}
        <button class="pin-key ghost" onclick="pinClear()">Hapus</button>
        <button class="pin-key" onclick="pinPress('0')">0</button>
        <button class="pin-key ghost" onclick="pinBack()">⌫</button>
      </div>
      <div class="login-hint">PIN demo tersedia di menu Tim &amp; Cabang.</div>
    `;
  }
}
function selectLoginEmp(id){ loginSelectedEmp = id; pinInput=''; renderLoginStep(); }
function backToEmpSelect(){ loginSelectedEmp = null; pinInput=''; renderLoginStep(); }
function pinBack(){ pinInput = pinInput.slice(0,-1); renderLoginStep(); }
function pinClear(){ pinInput=''; renderLoginStep(); }
function pinPress(d){
  const emp = getEmp(loginSelectedEmp);
  const pinLen = (emp.pin||'0000').length;
  if(pinInput.length>=pinLen) return;
  pinInput += d;
  renderLoginStep();
  if(pinInput.length===pinLen){
    setTimeout(()=>{
      if(pinInput===emp.pin){ loginSuccess(emp); }
      else{
        const dots = document.getElementById('pinDots');
        if(dots){ dots.querySelectorAll('.pin-dot').forEach(el=>el.classList.add('shake')); }
        toast('PIN salah, coba lagi.');
        setTimeout(()=>{ pinInput=''; renderLoginStep(); }, 350);
      }
    }, 120);
  }
}
function loginSuccess(emp){
  isLocked = false;
  state.settings.currentEmployeeId = emp.id;
  state.settings.currentBranchId = emp.branchId || state.settings.currentBranchId;
  if(emp.role==='Admin') state.view = 'dashboard';
  ensureViewAllowed();
  scheduleSave();
  renderShell();
  toast('Selamat bekerja, ' + emp.name.split(' ')[0] + '!');
}
function lockApp(){
  isLocked = true;
  renderLogin();
}

          <label class="field">Ulangi Password<input type="password" id="su_pass2"></label>
        </div>
        <label class="field">Nama Bisnis<input type="text" id="su_biz" placeholder="mis. Teman Coffee"></label>
        <label class="field">Nama Cabang Pertama<input type="text" id="su_branch" placeholder="mis. Cabang Pusat"></label>
        <label class="field">Nama Anda (jadi Admin)<input type="text" id="su_admin" placeholder="Nama lengkap"></label>
        <div class="field-row">
          <label class="field">PIN Admin (4-6 digit)<input type="text" id="su_pin" inputmode="numeric" maxlength="6" placeholder="mis. 1234"></label>
          <label class="field">Ulangi PIN<input type="text" id="su_pin2" inputmode="numeric" maxlength="6"></label>
        </div>
        <div id="suError" style="font-size:11.5px;margin-bottom:8px;"></div>
        <button class="btn btn-primary btn-block" style="margin-bottom:8px;" onclick="handleSignUp()">Daftar &amp; Mulai</button>
        <button class="btn btn-ghost btn-block" onclick="renderAuthWelcome()">← Kembali</button>
      </div>
    </div>`;
}
async function handleSignUp(){
  const email = document.getElementById('su_email').value.trim();
  const pass = document.getElementById('su_pass').value;
  const pass2 = document.getElementById('su_pass2').value;
  const bizName = document.getElementById('su_biz').value.trim();
  const branchName = document.getElementById('su_branch').value.trim();
  const adminName = document.getElementById('su_admin').value.trim();
  const pin = document.getElementById('su_pin').value.trim();
  const pin2 = document.getElementById('su_pin2').value.trim();
  const errEl = document.getElementById('suError');
  if(!email || !pass || !bizName || !branchName || !adminName || !pin){ errEl.style.color='var(--rust)'; errEl.textContent = 'Semua kolom wajib diisi.'; return; }
  if(pass.length<6){ errEl.style.color='var(--rust)'; errEl.textContent = 'Password minimal 6 karakter.'; return; }
  if(pass!==pass2){ errEl.style.color='var(--rust)'; errEl.textContent = 'Password dan ulangi password tidak sama.'; return; }
  if(!/^\d{4,6}$/.test(pin)){ errEl.style.color='var(--rust)'; errEl.textContent = 'PIN harus 4-6 digit angka.'; return; }
  if(pin!==pin2){ errEl.style.color='var(--rust)'; errEl.textContent = 'PIN dan ulangi PIN tidak sama.'; return; }
  errEl.style.color='var(--ink-soft)'; errEl.textContent = 'Mendaftarkan...';
  try{
    const resp = await authSignUp(email, pass);
    if(!resp || !resp.access_token){
      // Konfirmasi email diaktifkan di project Supabase -> belum ada sesi langsung
      errEl.style.color='var(--green)';
      errEl.textContent = 'Akun dibuat. Cek email Anda untuk konfirmasi, lalu masuk lewat halaman Masuk.';
      setTimeout(()=>renderSignIn(), 2500);
      return;
    }
    saveAuthSessionFromResponse(resp);
    authSession.business_id = authSession.user_id; persistSession();
    const fresh = freshBusinessState({businessName:bizName, branchName, adminName, adminPin:pin});
    await upsertBusinessRow(fresh);
    state = fresh; normalizeState(state);
    storageMode = 'supabase'; lastSupabaseError=''; lastKnownUpdatedAt = new Date().toISOString();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    startBizPolling();
    isLocked = false;
    state.settings.currentEmployeeId = state.employees[0].id;
    state.view = 'dashboard';
    ensureViewAllowed();
    renderShell();
    toast('Bisnis berhasil didaftarkan. Selamat datang, ' + adminName.split(' ')[0] + '!');
  }catch(e){
    errEl.style.color = 'var(--rust)';
    errEl.textContent = friendlyFetchError(e);
  }
}

function renderSignIn(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-card" style="max-width:440px;">
        <div class="login-brand">
          <div class="login-mark brand-logo-row" style="justify-content:center;">${COFFEE_LOGO(24)}<span>Masuk ke Bisnis Saya</span></div>
          <div class="login-sub">Untuk perangkat baru yang bergabung ke bisnis yang sudah ada</div>
        </div>
        <label class="field">Email<input type="email" id="si_email" placeholder="nama@email.com"></label>
        <label class="field">Password<input type="password" id="si_pass"></label>
        <div id="siError" style="font-size:11.5px;margin-bottom:8px;"></div>
        <button class="btn btn-primary btn-block" style="margin-bottom:8px;" onclick="handleSignIn()">Masuk</button>
        <button class="btn btn-ghost btn-block" onclick="renderAuthWelcome()">← Kembali</button>
      </div>
    </div>`;
}
async function handleSignIn(){
  const email = document.getElementById('si_email').value.trim();
  const pass = document.getElementById('si_pass').value;
  const errEl = document.getElementById('siError');
  if(!email || !pass){ errEl.style.color='var(--rust)'; errEl.textContent = 'Isi email dan password.'; return; }
  errEl.style.color='var(--ink-soft)'; errEl.textContent = 'Memeriksa...';
  try{
    const resp = await authSignIn(email, pass);
    saveAuthSessionFromResponse(resp);
    const bizId = await resolveMyBusinessId();
    if(!bizId){
      errEl.style.color='var(--rust)';
      errEl.textContent = 'Akun ini belum terhubung ke bisnis manapun. Hubungi Admin bisnis Anda untuk dibuatkan akses lewat menu Pengaturan.';
      clearAuthSession();
      return;
    }
    authSession.business_id = bizId; persistSession();
    const row = await fetchBusinessRow();
    if(row && row.data){
      state = row.data; normalizeState(state); lastKnownUpdatedAt = row.updated_at;
    } else {
      // Kasus langka: akun pemilik terverifikasi tapi baris data belum sempat dibuat -> mulai dari kosong
      state = freshBusinessState({businessName:'Bisnis Baru', branchName:'Cabang Pusat', adminName:'Admin', adminPin:'1234'});
      await upsertBusinessRow(state);
    }
    storageMode = 'supabase'; lastSupabaseError=''; 
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    startBizPolling();
    renderLogin();
  }catch(e){
    errEl.style.color = 'var(--rust)';
    errEl.textContent = friendlyFetchError(e);
  }
}

/* ============================= INIT ============================= */
(async function init(){
  loadAuthSession();
  if(authSession){
    const ok = await ensureFreshSession();
    if(ok){
      try{
        const row = await fetchBusinessRow();
        if(row && row.data){
          state = row.data; normalizeState(state); lastKnownUpdatedAt = row.updated_at;
          storageMode = 'supabase'; lastSupabaseError='';
          try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
          startBizPolling();
          if(isLocked) renderLogin(); else renderShell();
          return;
        }
      }catch(e){ console.warn('Gagal memuat data bisnis, lanjut ke mode lokal:', e); }
    }
  }
  const hasLocalData = !!localStorage.getItem(STORAGE_KEY);
  if(!hasLocalData){ renderAuthWelcome(); return; }
  await loadState();
  if(isLocked) renderLogin(); else renderShell();
})();

// Daftarkan service worker (untuk dukungan "Instal Aplikasi" di Android/Chrome).
// Aman diabaikan kalau gagal (mis. dibuka dari file:// atau preview sandbox) —
// aplikasi tetap berjalan normal tanpa ini, hanya saja tidak bisa diinstal.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* diamkan, tidak kritis */ });
  });
}
</script>
