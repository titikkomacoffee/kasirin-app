<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KasirKu</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--p:#0d9488;--bg:#f3f5fa;--c:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0}
[data-d=on]{--bg:#0b1220;--c:#151e30;--t:#e8edf7;--m:#94a3b8;--b:#25314a}
*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:110px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 55%,#000));color:#fff;border-radius:0 0 24px 24px}
header b{font-size:18px}main{padding:16px;max-width:900px;margin:auto}h2,h3{margin:4px 0 10px}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);font:inherit}
.btn{display:block;width:100%;padding:12px 16px;margin:6px 0;border:0;border-radius:12px;background:var(--p);color:#fff;font:600 15px inherit;text-align:center;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--p);border:1.5px solid var(--p)}.row .btn{width:auto;flex:1}
.card{background:var(--c);border-radius:16px;padding:12px;margin:8px 0;border:1px solid var(--b)}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}.m,small{color:var(--m)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--b);background:var(--c);color:var(--t);white-space:nowrap;font:inherit}.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pr{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:8px;text-align:left;color:var(--t);font:inherit;cursor:pointer}.pr img,.th{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--b)}.th{width:56px;height:56px}.pr b{display:block;font-size:13px;margin-top:6px}.pr span{color:var(--p);font-weight:800}
.ic{background:none;border:0;font-size:18px}

#modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;justify-content:center;z-index:9}.sheet{background:var(--c);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}
.rc{font:13px monospace;background:#fff;color:#000;padding:10px;border-radius:8px}.rc span{float:right}.bar{display:flex;align-items:flex-end;gap:4px;height:120px}.bar div{flex:1;background:var(--p);border-radius:6px 6px 0 0;min-height:2px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi .card b{font-size:18px;display:block}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;display:none}
.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:var(--c);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px #0f172a18;z-index:5}
.nav button{border:0;background:none;color:var(--m);font:600 11px inherit;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}.nav button.on{color:var(--p)}.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.fab{margin-top:-34px}.nav button.fab span{width:60px;height:60px;border-radius:50%;background:var(--p);display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--p) 55%,transparent);border:4px solid var(--c)}.nav button.fab svg{stroke:#fff;width:26px;height:26px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mg button{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:16px 6px;color:var(--t);font:600 12px inherit;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}.mg svg{width:26px;height:26px;stroke:var(--p);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ph{width:100%;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:34px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 45%,#000))}
.pr{box-shadow:0 2px 10px #0f172a0d;transition:transform .12s}.pr:active{transform:scale(.96)}.card{box-shadow:0 2px 10px #0f172a08}
@media(min-width:900px){main{max-width:1100px}.pos{display:grid;grid-template-columns:1fr 370px;gap:16px}#cartbox{position:sticky;top:12px;align-self:start}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.mg{grid-template-columns:repeat(4,1fr)}.nav{max-width:560px;left:50%;transform:translateX(-50%);border-radius:24px;bottom:10px}}
.hero{margin:-16px -16px 0;padding:calc(22px + env(safe-area-inset-top)) 20px 74px;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 60%,#000));border-radius:0 0 28px 28px;color:#fff}.bell{width:42px;height:42px;border:0;border-radius:14px;background:#ffffff26;display:grid;place-items:center}.bell svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-54px}.kc{background:var(--c);border-radius:20px;padding:14px;box-shadow:0 8px 24px #0f172a14;display:flex;flex-direction:column;gap:4px}.kc b{font-size:19px}.ki{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:6px}.ki svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bd{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}.bd.up{background:#dcfce7;color:#16a34a}.bd.dn{background:#fee2e2;color:#dc2626}
.kas{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px;border-radius:20px;cursor:pointer}.kas .ki{margin:0}.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.sg button{border:0;background:none;color:var(--t);font:600 12px inherit;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}.sg .ki{width:58px;height:58px;border-radius:18px;margin:0}.sg .ki svg{width:26px;height:26px}
@media(min-width:900px){.kg{grid-template-columns:repeat(4,1fr)}}
#dlg{display:none;position:fixed;inset:0;background:#0b122099;backdrop-filter:blur(6px);z-index:20;align-items:center;justify-content:center;padding:20px}
.dbox{background:var(--c);width:100%;max-width:380px;border-radius:28px;padding:24px 20px 18px;box-shadow:0 24px 60px #0006;animation:pop .22s ease;text-align:center}.dbox h3{margin:0 0 6px;font-size:19px}.dbox p{margin:0 0 6px;font-size:14px}
@keyframes pop{from{transform:scale(.9) translateY(10px);opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.dic{width:60px;height:60px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p)}.dic.dg{background:#fee2e2;color:#dc2626}.dic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fl{display:block;text-align:left;font-size:12px;font-weight:700;color:var(--m);margin:10px 0 0}.btn.red{background:#dc2626}.dbox .row{margin-top:14px}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--p) 55%,transparent);border-color:var(--p)}
#modal{backdrop-filter:blur(4px)}.sheet{animation:up .25s ease}.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:9px;background:var(--b);margin:-6px auto 12px}
#toast{background:#0f172ae6;backdrop-filter:blur(8px);border-radius:16px;box-shadow:0 10px 30px #0004;font-size:14px;font-weight:600;animation:pop .2s ease;max-width:90%;text-align:center}
.av{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 45%,#000))}.rb{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.fg small{display:block;font-weight:600}.emp{padding:14px;border-radius:20px}
.sw{position:relative;width:48px;height:28px;flex:none}.sw input{opacity:0;width:0;height:0;padding:0;margin:0;border:0;position:absolute}.sw i{position:absolute;inset:0;background:var(--b);border-radius:99px;transition:.2s}.sw i::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px #0004}.sw input:checked+i{background:var(--p)}.sw input:checked+i::after{transform:translateX(20px)}
.sec{font-size:11px;letter-spacing:.08em;color:var(--m);margin:18px 2px 8px;font-weight:800}.mg button.dgr{color:#dc2626}.mg button.dgr svg{stroke:#dc2626}
#cbar{display:none;position:fixed;left:12px;right:12px;bottom:calc(114px + env(safe-area-inset-bottom));z-index:4;background:var(--p);color:#fff;border-radius:20px;padding:13px 16px;align-items:center;gap:12px;box-shadow:0 10px 30px color-mix(in srgb,var(--p) 45%,transparent);animation:up .25s ease;cursor:pointer}#cbar .cnt{background:#ffffff33;border-radius:12px;padding:4px 10px;font-weight:800;font-size:13px}
.qb{width:36px;height:36px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--p);font:700 20px inherit;cursor:pointer;line-height:1}
@media(max-width:899px){#cartbox{display:none}.pos>div:first-child{padding-bottom:84px}}
@media(min-width:900px){#cbar{display:none!important}}
.dgbtn{color:#dc2626!important;border-color:#dc2626!important}
#toast{display:flex!important;flex-direction:column;align-items:center;gap:8px;position:fixed!important;top:calc(10px + env(safe-area-inset-top))!important;left:0!important;right:0!important;transform:none!important;background:none!important;box-shadow:none!important;padding:0!important;border-radius:0!important;max-width:none!important;pointer-events:none;animation:none!important;z-index:99}
.tn{pointer-events:auto;display:flex;align-items:center;gap:10px;min-width:230px;max-width:92vw;background:var(--c);color:var(--t);border-radius:18px;padding:11px 14px;box-shadow:0 14px 34px #0f172a38;border:1px solid var(--b);position:relative;overflow:hidden;animation:tin .3s cubic-bezier(.2,.9,.3,1.2);cursor:pointer}
.tn .ti{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}.tn .ti svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.tn b{font-size:14px;font-weight:600;line-height:1.3}
.tn.ok .ti{background:#dcfce7;color:#16a34a}.tn.er .ti{background:#fee2e2;color:#dc2626}.tn.in .ti{background:color-mix(in srgb,var(--p) 15%,transparent);color:var(--p)}
.tn::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;opacity:.45;transform-origin:left;animation:tbar 3.3s linear forwards}.tn.ok::after{background:#16a34a}.tn.er::after{background:#dc2626}.tn.in::after{background:var(--p)}
.tn.out{animation:tout .22s ease forwards}@keyframes tin{from{transform:translateY(-26px) scale(.94);opacity:0}}@keyframes tbar{to{transform:scaleX(0)}}@keyframes tout{to{transform:translateY(-16px);opacity:0}}
.pt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}.pt button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:1.5px solid var(--b);background:var(--c);color:var(--t);font:600 13px inherit;cursor:pointer}.pt button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pt button.on{border-color:var(--p);background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p)}
.qa{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.qa button{padding:9px 14px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t);font:600 13px inherit;cursor:pointer}.qa button.on{background:var(--p);color:#fff;border-color:var(--p)}
.seg{display:flex;background:color-mix(in srgb,var(--p) 10%,var(--bg));border-radius:18px;padding:5px;gap:4px;margin:6px 0 12px}.seg button{flex:1;border:0;border-radius:14px;padding:12px 6px;background:none;color:var(--m);font:700 14px inherit;cursor:pointer}.seg button.on{background:var(--c);color:var(--t);box-shadow:0 2px 8px #0f172a1f}
.mt{display:grid;grid-template-columns:1fr 56px 110px;gap:6px;padding:9px 0;border-top:1px solid var(--b);font-size:14px}
.bell{position:relative}.bdg{position:absolute;top:-5px;right:-5px;background:#ef4444;color:#fff;border-radius:99px;font:700 11px/1 inherit;padding:3px 6px;font-style:normal}
textarea{width:100%;padding:12px;margin:5px 0;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);font:inherit;resize:vertical}

V.terima=async()=>{const{data:b}=await sb.from('branches').select('*');brs=b||[];MY=brs.find(x=>x.id==me.branch_id)?.name||'Pusat';const{data:h}=await sb.from('transfers').select('*,transfer_items(*)').eq('to_name',MY).order('created_at',{ascending:false}).limit(20);
 main().innerHTML=`<h2>Terima barang</h2><small>Kiriman menuju <b>${esc(MY)}</b>. Isi jumlah yang benar-benar diterima untuk tiap barang; selisih terbaca otomatis.</small>`+(h||[]).map(t=>{const ok=t.status=='diterima';return `<div class=card><div class=row><b style="flex:1">${t.kind=='kembali'?'↩ ':''}${esc(t.from_name)} → ${esc(t.to_name)}</b><span class=rb>${ok?'Diterima':'Dikirim'}</span></div><small>${new Date(t.created_at).toLocaleString('id-ID')} · ${esc(t.by_name||'')}</small>${(t.transfer_items||[]).map(i=>{const r=i.received_qty,d=ok&&r!=null?+r-+i.qty:0;return `<div class=row style="padding:6px 0;border-bottom:1px dashed var(--b)"><div style="flex:1">${i.item_type=='produk'?'🥤 ':''}${esc(i.name)}<br><small>Dikirim ${i.qty} ${esc(i.unit)}${ok&&r!=null?' · diterima '+r:''}</small></div>${ok?(d?`<b style="color:#dc2626">${d>0?'+':''}${d}</b>`:''):`<input class=rq type=number inputmode=decimal style="width:90px;text-align:right" data-i="${i.id}" data-q="${i.qty}" data-n="${esc(i.name)}" placeholder="Diterima">`}</div>`}).join('')}${ok?`<small>Diterima oleh ${esc(t.received_by||'')} · ${new Date(t.received_at).toLocaleString('id-ID')}</small>`:`<button class=btn onclick="terima('${t.id}',this)">Terima barang</button>`}</div>`}).join('')||'<p class=m>Belum ada kiriman untuk cabang ini.</p>'}
async function terima(id,btn){const rs=[...btn.closest('.card').querySelectorAll('.rq')];if(rs.some(r=>r.value===''))return toast('Isi jumlah diterima untuk semua barang');const df=rs.filter(r=>+r.value!=+r.dataset.q).map(r=>`${r.dataset.n}: kirim ${r.dataset.q}, terima ${r.value}`);if(!await dlg({t:df.length?'Ada selisih barang':'Terima barang?',m:df.length?df.join('\n')+'\nLanjut terima dengan jumlah ini?':'Jumlah sesuai dengan kiriman.',ic:'inbox',ok:'Terima',danger:!!df.length}))return;
 for(const r of rs){const e=await sb.from('transfer_items').update({received_qty:+r.value}).eq('id',r.dataset.i);if(e.error)return toast(/received_qty|schema/.test(e.error.message)?'Jalankan update-nota-stok.sql di Supabase dulu':e.error.message)}
 const r=await sb.from('transfers').update({status:'diterima',received_by:me.name,received_at:iso(new Date())}).eq('id',id);if(r.error)toast(r.error.message);else{const ap=await sb.rpc('apply_transfer',{p_id:id,p_phase:'receive'});toast(ap.error?'Diterima, tapi stok belum bertambah: jalankan update-stok-gaji.sql':df.length?'Diterima dengan selisih tercatat ✔':'Barang diterima, stok bertambah ✔')}V.terima()}
V.terbuang=async()=>{await loadProds();ing=(await sb.from('ingredients').select('*').order('name')).data||[];wl=[wNew('minuman')];wh=(await sb.from('waste_logs').select('*').order('created_at',{ascending:false}).limit(15)).data||[];wDraw()}
function wDraw(){main().innerHTML=`<h2>Catat terbuang</h2><small>Stok berkurang. Semua bahan di resep menu ikut terpotong, termasuk cup.</small>`+wl.map((w,i)=>`<div class=card><div class=row><b style="flex:1">${w.kind=='minuman'?'Minuman rusak':'Bahan saja'}</b><button class=ic onclick="wl.splice(${i},1);wDraw()">🗑️</button></div><select onchange="wl[${i}].id=this.value"><option value="">Pilih ${w.kind=='minuman'?'produk':'bahan'}</option>${(w.kind=='minuman'?prods:ing).map(x=>`<option value="${x.id}" ${x.id==w.id?'selected':''}>${esc(x.name)}${w.kind=='bahan'?' ('+esc(x.unit)+')':''}</option>`).join('')}</select><input type=number inputmode=decimal placeholder="${w.kind=='minuman'?'Jumlah cup':'Jumlah'}" value="${w.qty}" oninput="wl[${i}].qty=this.value"><div class=chips style="flex-wrap:wrap">${WR.map(r=>`<button class="chip ${w.reason==r?'on':''}" onclick="wl[${i}].reason='${r}';wDraw()">${r}</button>`).join('')}</div><input placeholder="Catatan ${w.reason=='Lainnya'?'(wajib)':'(opsional)'}" value="${esc(w.note)}" oninput="wl[${i}].note=this.value"></div>`).join('')+`<div class=row><button class="btn ghost" onclick="wl.push(wNew('minuman'));wDraw()">+ Minuman rusak</button><button class="btn ghost" onclick="wl.push(wNew('bahan'));wDraw()">+ Bahan saja</button></div><button class=btn onclick=wSave()>Simpan</button><h3 style="margin-top:18px">Riwayat terbuang</h3>`+(wh.map(x=>`<div class=card><b>${esc(x.name)}</b> · ${+x.qty} ${esc(x.unit)}<br><small>${esc(x.reason)}${x.note?' · '+esc(x.note):''} · ${esc(x.by_name||'')} · ${new Date(x.created_at).toLocaleString('id-ID')}</small></div>`).join('')||'<p class=m>Belum ada catatan.</p>')}
async function wSave(){const rows=wl.filter(w=>w.id||w.qty||w.reason);if(!rows.length)return toast('Belum ada yang diisi');for(const w of rows){if(!w.id||!(+w.qty>0))return toast('Lengkapi produk/bahan dan jumlahnya');if(!w.reason)return toast('Pilih alasan');if(w.reason=='Lainnya'&&!w.note.trim())return toast('Catatan wajib bila alasan Lainnya')}
 const L=rows.map(w=>{const o=(w.kind=='minuman'?prods:ing).find(x=>x.id==w.id);return{kind:w.kind,ref_id:w.id,name:o.name,unit:w.kind=='bahan'?o.unit:'cup',qty:+w.qty,reason:w.reason,note:w.note.trim(),by_id:me.id,by_name:me.name}});
 const a=await sb.from('waste_logs').insert(L);if(a.error)return toast(a.error.message);const b=await sb.rpc('waste_deduct',{p_items:L.map(l=>({kind:l.kind,id:l.ref_id,qty:l.qty})),p_branch:me.branch_id||null});toast(b.error?'Stok gagal diperbarui: '+b.error.message:'Tersimpan ✔');V.terbuang()}

// ---------- Pasang aplikasi (PWA) ----------
let dip=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});window.addEventListener('appinstalled',()=>{dip=null;toast('Aplikasi terpasang ✔')});
async function installApp(){if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return toast('Aplikasi sudah terpasang');
 if(dip){dip.prompt();await dip.userChoice;dip=null;return}
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);dlg({t:'Pasang KasirKu',m:ios?'Di Safari: ketuk tombol Bagikan (kotak dengan panah), lalu pilih "Tambah ke Layar Utama".':'Di Chrome: ketuk menu titik tiga (⋮) di kanan atas, lalu pilih "Pasang aplikasi" atau "Tambahkan ke layar utama".',ic:'download',ok:'Mengerti'})}

// ---------- Buka kasir ----------
async function loadShift(){const{data}=await sb.from('shifts').select('*').eq('cashier_id',me.id).is('closed_at',null).order('opened_at',{ascending:true}).limit(1);shift=data&&data[0]||null;return shift}
async function openShift(cash){const ex=await loadShift();if(ex)return ex;const{data,error}=await sb.from('shifts').insert({cashier_id:me.id,cashier:me.name,open_cash:cash}).select().single();if(error){toast(error.message);return null}shift=data;return data}
async function bukaKasir(){if(!navigator.onLine)return toast('Buka kasir butuh internet. Hubungkan dulu sekali.');if(shift)return go('shift');const r=await dlg({t:'Buka kasir',m:'Masukkan uang kas awal yang ada di laci kasir.',ic:'wallet',f:[{l:'Kas awal (Rp)',type:'number',ph:'0'}],ok:'Buka kasir'});if(!r||busy)return;busy=true;const had=await loadShift(),s0=had||await openShift(+r[0]||0);busy=false;if(!s0)return;toast(had?'Kasir sudah dibuka sebelumnya ✔':'Kasir dibuka ✔');closeM();if(tab=='kasir')V.kasir();else go('kasir')}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)loadShift().then(()=>{if(tab=='beranda')V.beranda()})});

// ---------- Setelan ----------
V.setelan=async()=>{if(!biz)biz=(await sb.from('businesses').select('*').maybeSingle()).data;const wd=(cfg.workdays||'0,1,2,3,4,5,6').split(',');
 main().innerHTML=`<h2>Setelan</h2>${PLAT?`<div class=card><b>Pengaturan langganan (developer)</b><br><small>Atur paket, harga, masa demo, dan info pembayaran untuk semua bisnis.</small><button class=btn onclick="go('subset')">Buka pengaturan langganan</button></div>`:''}
 <div class=card><b>Nama bisnis / toko</b><input id=sn value="${esc(cfg.store||(biz&&biz.name)||'')}" placeholder="Nama toko"><button class=btn onclick="saveStore()">Simpan</button></div>
 <div class=card><b>Aturan kasir</b><small>Pesanan ditahan dan piutang dari shift ini harus dibayar dulu sebelum transaksi baru.</small><div class=pt style="grid-template-columns:1fr 1fr"><button class="${cfg.force_pending!=='0'?'on':''}" onclick="setCfg('force_pending','1').then(()=>V.setelan())">Wajib bayar dulu</button><button class="${cfg.force_pending==='0'?'on':''}" onclick="setCfg('force_pending','0').then(()=>V.setelan())">Boleh transaksi baru</button></div></div>
 <div class=card><b>Kode bisnis</b><p class=m style="margin:4px 0 8px">Bagikan kode ini ke karyawan agar bisa mendaftar lewat menu "Gabung" di halaman login. Akun baru menunggu persetujuan Anda di menu Tim.</p><div class=row><input readonly value="${esc((biz&&biz.code)||'-')}" style="font-weight:800;letter-spacing:.2em;text-align:center"><button class="btn ghost" style="width:auto" onclick="copyCode()">Salin</button></div></div>
 <div class=card><b>Aturan absensi & denda</b><br><small>Hanya Admin yang bisa mengubah ini.</small>
  <label class=fl>Batas jam absen masuk</label><input id=ai type=time value="${esc(cfg.att_in||'')}">
  <label class=fl>Toleransi keterlambatan (menit)</label><input id=at type=number inputmode=numeric value="${esc(cfg.att_tol||'')}" placeholder="0">
  <label class=fl>Denda terlambat (Rp per hari)</label><input id=fl type=number inputmode=numeric value="${esc(cfg.fine_late||'')}" placeholder="0">
  <label class=fl>Denda tidak masuk (Rp per hari kerja)</label><input id=fa type=number inputmode=numeric value="${esc(cfg.fine_absent||'')}" placeholder="0">
  <label class=fl>Denda tidak absen pulang (Rp per hari)</label><input id=fn type=number inputmode=numeric value="${esc(cfg.fine_nopulang||'')}" placeholder="0">
  <label class=fl>Hari kerja</label><div class=chips style="flex-wrap:wrap">${[['Sen',1],['Sel',2],['Rab',3],['Kam',4],['Jum',5],['Sab',6],['Min',0]].map(([l,d])=>`<button class="chip wdb ${wd.includes(String(d))?'on':''}" data-d="${d}" onclick="this.classList.toggle('on')">${l}</button>`).join('')}</div>
  <label class=fl>Denda tidak masuk berlaku mulai tanggal</label><input id=fs type=date value="${esc(cfg.fine_start||ymd(new Date()))}">
  <button class=btn onclick="saveAtt()">Simpan aturan</button></div>
 <div class=card><b>Warna tema</b><div class=chips>${Object.entries(THEMES).map(([n,c])=>`<button class=chip style="border-color:${c};color:${c}" onclick="theme('${c}')">${n}</button>`).join('')}</div><button class="btn ghost" onclick="localStorage.dk=localStorage.dk=='on'?'off':'on';theme()">Mode gelap / terang</button></div>
 <div class=card><b>QRIS statis</b><br>${cfg.qris?`<img src="${cfg.qris}" style="width:160px">`:''}<input id=qf type=file accept=image/*><button class=btn onclick=upQ()>Upload QRIS</button></div>
 <div class=card><b>Logo toko (watermark absensi)</b><br>${cfg.logo?`<img src="${cfg.logo}" style="height:70px">`:''}<input id=lf type=file accept=image/*><button class=btn onclick=upL()>Upload logo</button></div>
 <button class="btn ghost" onclick="sb.auth.signOut().then(()=>location.reload())">Keluar</button>`}
async function saveStore(){const v=$('#sn').value.trim();if(!v)return toast('Nama wajib diisi');await setCfg('store',v);if(biz)await sb.from('businesses').update({name:v}).eq('id',biz.id)}
function copyCode(){if(!biz)return;navigator.clipboard&&navigator.clipboard.writeText(biz.code);toast('Kode disalin ✔')}
async function saveAtt(){const wd=[...document.querySelectorAll('.wdb.on')].map(b=>b.dataset.d).join(','),o={att_in:$('#ai').value,att_tol:$('#at').value||'0',fine_late:$('#fl').value||'0',fine_absent:$('#fa').value||'0',fine_nopulang:$('#fn').value||'0',workdays:wd,fine_start:$('#fs').value};const rows=Object.entries(o).map(([key,value])=>({key,value:String(value)})),r=await sb.from('settings').upsert(rows,{onConflict:'business_id,key'});if(r.error)return toast(r.error.message);Object.assign(cfg,o);toast('Aturan absensi tersimpan ✔')}
async function setCfg(k,v){cfg[k]=v;const r=await sb.from('settings').upsert({key:k,value:v},{onConflict:'business_id,key'});toast(r.error?r.error.message:'Tersimpan')}
async function upL(){const f=$('#lf').files[0];if(!f)return toast('Pilih gambar logo');const u=await up(f,'logo');if(u){await setCfg('logo',u);V.setelan()}}
async function upQ(){const f=$('#qf').files[0];if(!f)return toast('Pilih gambar QRIS');const u=await up(f,'qris');if(u){await setCfg('qris',u);V.setelan()}}
init();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
